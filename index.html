<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crong Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbf5df;color:#17243f;font-family:Arial,sans-serif}
header{height:60px;background:#f8edc5;border-bottom:2px solid #d8cda8;display:flex;align-items:center;justify-content:space-between;padding:0 5%}
.logo{font-size:21px;font-weight:900}
main{max-width:1120px;margin:24px auto;padding:0 16px}
h1{font-size:28px}
.intro{color:#85764a;font-size:14px}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
.panel,.workspace{background:#fffdf5;border:2px solid #d8cda8;border-radius:16px;padding:16px}
.tabs{display:flex;gap:5px;margin-bottom:15px}
.tab,.btn{border:0;border-radius:9px;padding:10px;background:#f5efd9;color:#17243f;font-weight:bold;cursor:pointer}
.tab{flex:1}
.tab.active,.btn.primary{background:#17243f;color:#f8edc5}
.section{border-top:1px dashed #d8cda8;padding-top:14px;margin-top:14px}
.section h3{font-size:14px;margin:0 0 12px}
.patterns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pattern{padding:10px 3px;border:2px solid #e0d6b7;border-radius:9px;background:white;color:#756943}
.pattern.selected{border-color:#17243f;background:#f8edc5}
label{display:flex;justify-content:space-between;font-size:12px;margin:12px 0 6px}
input[type=range]{width:100%;accent-color:#17243f}
.canvas-wrap{display:flex;justify-content:center;background:#f8edc5;padding:10px;border-radius:12px}
canvas{width:min(100%,560px);height:auto;max-height:70vh;border:2px solid #d8cda8;touch-action:none}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.note{font-size:12px;color:#85764a;line-height:1.6}
[hidden]{display:none!important}

/* 색상 선택 창 */
.color-open{width:100%;padding:11px;border:1px solid #d8cda8;border-radius:9px;background:#f8edc5;color:#17243f;font-weight:bold}
.picker{background:#292929;color:white;padding:13px;border-radius:13px;margin-top:10px}
.picker-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:10px}
.picker-top button{background:none;border:0;color:white;font-size:20px}
.picker-area{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.hue-ring{width:190px;height:190px;position:relative;flex:none}
.hue-ring canvas{width:190px;height:190px;border:0;touch-action:pan-y}
.color-square{width:160px;height:160px;position:relative;touch-action:none;cursor:crosshair}
.color-square canvas{width:160px;height:160px;border:0}
.picker-preview{width:100%;height:25px;border-radius:5px;margin:12px 0}
.rgb-row{display:flex;align-items:center;gap:7px;margin:8px 0;font-size:12px}
.rgb-row span{width:15px}
.rgb-row input{flex:1;min-width:0}
.rgb-row output{width:32px;text-align:right}
.hex-row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px}
.hex-row input{width:100%;min-width:0;background:#444;color:white;border:1px solid #666;border-radius:6px;padding:9px}
.opacity-row{margin-top:12px}
.opacity-row input{width:100%}
@media(max-width:700px){
 .layout{grid-template-columns:1fr}
 .workspace{order:1}.panel{order:2}
 .hue-ring{width:160px;height:160px}
 .hue-ring canvas{width:160px;height:160px}
 .color-square{width:140px;height:140px}
 .color-square canvas{width:140px;height:140px}
}
</style>
</head>
<body>
<header>
 <div class="logo">Crong Studio</div>
 <button class="btn" id="downloadTop">저장</button>
</header>
<main>
<h1>도트 패턴 스튜디오</h1>
<p class="intro">색을 고르고 패턴을 만들어 보세요.</p>
<div class="layout">
<aside class="panel">
 <div class="tabs">
  <button class="tab active" data-tab="bg">배경</button>
  <button class="tab" data-tab="pattern">패턴</button>
 </div>

 <div id="bgTools">
  <div class="section">
   <h3>배경 색상</h3>
   <button class="color-open" id="openBg">배경 색상 선택</button>
   <div class="picker" id="bgPicker" hidden>
    <div class="picker-top">색상 선택 <button data-close="bgPicker">×</button></div>
    <div class="picker-area">
     <div class="hue-ring"><canvas id="bgHue" width="190" height="190"></canvas></div>
     <div class="color-square"><canvas id="bgSquare" width="160" height="160"></canvas></div>
    </div>
    <div class="picker-preview" id="bgPreview"></div>
    <div class="rgb-row"><span>R</span><input id="bgR" type="range" min="0" max="255"><output id="bgRout"></output></div>
    <div class="rgb-row"><span>G</span><input id="bgG" type="range" min="0" max="255"><output id="bgGout"></output></div>
    <div class="rgb-row"><span>B</span><input id="bgB" type="range" min="0" max="255"><output id="bgBout"></output></div>
    <div class="opacity-row">투명도 <input id="bgAlpha" type="range" min="0" max="100" value="100"></div>
    <div class="hex-row">HEX <input id="bgHex" value="#F8EDC5" maxlength="7"></div>
   </div>
  </div>
  <div class="section">
   <h3>배경 패턴</h3>
   <div class="patterns" id="patterns">
    <button class="pattern selected" data-pattern="plain">기본</button>
    <button class="pattern" data-pattern="dots">도트</button>
    <button class="pattern" data-pattern="check">체크</button>
    <button class="pattern" data-pattern="stripes">줄무늬</button>
    <button class="pattern" data-pattern="hearts">하트</button>
    <button class="pattern" data-pattern="stars">별</button>
   </div>
  </div>
 </div>

 <div id="patternTools" hidden>
  <div class="section">
   <h3>패턴 색상</h3>
   <button class="color-open" id="openPattern">패턴 색상 선택</button>
   <div class="picker" id="patternPicker" hidden>
    <div class="picker-top">색상 선택 <button data-close="patternPicker">×</button></div>
    <div class="picker-area">
     <div class="hue-ring"><canvas id="patternHue" width="190" height="190"></canvas></div>
     <div class="color-square"><canvas id="patternSquare" width="160" height="160"></canvas></div>
    </div>
    <div class="picker-preview" id="patternPreview"></div>
    <div class="rgb-row"><span>R</span><input id="patternR" type="range" min="0" max="255"><output id="patternRout"></output></div>
    <div class="rgb-row"><span>G</span><input id="patternG" type="range" min="0" max="255"><output id="patternGout"></output></div>
    <div class="rgb-row"><span>B</span><input id="patternB" type="range" min="0" max="255"><output id="patternBout"></output></div>
    <div class="opacity-row">투명도 <input id="patternAlpha" type="range" min="0" max="100" value="100"></div>
    <div class="hex-row">HEX <input id="patternHex" value="#FFC4D8" maxlength="7"></div>
   </div>
  </div>
  <div class="section">
   <h3>패턴 설정</h3>
   <label>패턴 크기 <span id="sizeLabel">8칸</span></label>
   <input type="range" id="patternSize" min="4" max="20" value="8">
   <label>패턴 방향 <span id="angleLabel">0°</span></label>
   <input type="range" id="patternAngle" min="0" max="315" step="45" value="0">
  </div>
 </div>

 <div class="section">
  <h3>내 작품 보관함</h3>
  <input id="projectName" placeholder="작품 이름" style="width:100%;padding:9px;border:1px solid #d8cda8;border-radius:8px">
  <button class="btn primary" id="saveProject" style="width:100%;margin-top:7px">작품 저장</button>
  <select id="savedProjects" style="width:100%;padding:9px;margin-top:7px">
   <option value="">저장된 작품 선택</option>
  </select>
  <button class="btn" id="loadProject" style="width:100%;margin-top:7px">불러오기</button>
  <button class="btn" id="deleteProject" style="width:100%;margin-top:7px">선택 작품 삭제</button>
  <p class="note" id="saveStatus">작품은 현재 브라우저에 저장돼요.</p>
 </div>

 <div class="section">
  <h3>도트 설정</h3>
  <label>한 줄의 도트 수 <span id="gridLabel">24개</span></label>
  <input type="range" id="gridSize" min="4" max="64" value="24">
  <label>도트 크기 <span id="dotSizeLabel">100%</span></label>
  <input type="range" id="dotSize" min="40" max="140" value="100">
  <button class="btn" id="clear" style="width:100%;margin-top:10px">처음부터</button>
 </div>
</aside>

<section class="workspace">
 <label>미리보기 크기
  <select id="canvasFormat">
   <option value="phone">휴대폰 · 9:16</option>
   <option value="desktop">PC · 16:9</option>
   <option value="tablet">태블릿 · 4:3</option>
   <option value="square">정사각형</option>
   <option value="wide">와이드 · 21:9</option>
  </select>
 </label>
 <div class="canvas-wrap">
  <canvas id="art" width="480" height="854"></canvas>
 </div>
 <div class="toolbar">
  <button class="btn" id="undo">되돌리기</button>
  <button class="btn" id="redo">다시 하기</button>
  <button class="btn" id="gridToggle">격자 켜기</button>
  <button class="btn primary" id="download">PNG 다운로드</button>
 </div>
 <p class="note">완성한 작품은 PNG 이미지로 저장할 수 있어요.</p>
</section>
</div>
</main>
<script>
const canvas=document.getElementById('art');
const ctx=canvas.getContext('2d');

let bg='#F8EDC5',patColor='#FFC4D8';
let pattern='plain',angle=0,n=24,showGrid=false;
let rows=43,pixels=[],undoStack=[],redoStack=[];
let hueBg=45,huePat=340,satBg=35,valBg=96,satPat=35,valPat=100;
let alphaBg=100,alphaPat=100;

function hexToRgb(hex){
 const v=parseInt(hex.replace('#',''),16);
 return {r:(v>>16)&255,g:(v>>8)&255,b:v&255};
}
function rgbToHex(r,g,b){
 return '#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('').toUpperCase();
}
function hsvToRgb(h,s,v){
 s/=100;v/=100;
 let c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;
 let a,b,d;
 if(h<60)[a,b,d]=[c,x,0];
 else if(h<120)[a,b,d]=[x,c,0];
 else if(h<180)[a,b,d]=[0,c,x];
 else if(h<240)[a,b,d]=[0,x,c];
 else if(h<300)[a,b,d]=[x,0,c];
 else [a,b,d]=[c,0,x];
 return {r:Math.round((a+m)*255),g:Math.round((b+m)*255),b:Math.round((d+m)*255)};
}
function rgbToHsv(r,g,b){
 r/=255;g/=255;b/=255;
 let max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min,h=0;
 if(d){
  if(max===r)h=60*(((g-b)/d)%6);
  else if(max===g)h=60*((b-r)/d+2);
  else h=60*((r-g)/d+4);
 }
 if(h<0)h+=360;
 return {h,s:max===0?0:d/max*100,v:max*100};
}

function drawHue(id){
 const c=document.getElementById(id),g=c.getContext('2d');
 const cx=c.width/2,cy=c.height/2,r= c.width/2-5;
 for(let a=0;a<360;a++){
  g.beginPath();g.strokeStyle=`hsl(${a},100%,50%)`;
  g.lineWidth=13;g.arc(cx,cy,r,a*Math.PI/180,(a+1.5)*Math.PI/180);g.stroke();
 }
}
drawHue('bgHue');drawHue('patternHue');

function drawSquare(id,h,s,v){
 const c=document.getElementById(id),g=c.getContext('2d');
 const w=c.width,hg=c.height;
 g.fillStyle=`hsl(${h},100%,50%)`;g.fillRect(0,0,w,hg);
 let white=g.createLinearGradient(0,0,w,0);
 white.addColorStop(0,'white');white.addColorStop(1,'transparent');
 g.fillStyle=white;g.fillRect(0,0,w,hg);
 let black=g.createLinearGradient(0,0,0,hg);
 black.addColorStop(0,'transparent');black.addColorStop(1,'black');
 g.fillStyle=black;g.fillRect(0,0,w,hg);
}

function setColor(which,r,g,b){
 const hex=rgbToHex(r,g,b);
 if(which==='bg')bg=hex;else patColor=hex;
 const pre=document.getElementById(which+'Preview');
 pre.style.background=hex;
 document.getElementById(which+'Hex').value=hex;
 ['R','G','B'].forEach((k,i)=>{
  const value=[r,g,b][i];
  document.getElementById(which+k).value=value;
  document.getElementById(which+k+'out').value=value;
 });
 render();
}

function setupPicker(which){
 const hueId=which+'Hue',squareId=which+'Square';
 const hexId=which+'Hex';
 let hue=which==='bg'?hueBg:huePat;
 let sat=which==='bg'?satBg:satPat;
 let val=which==='bg'?valBg:valPat;
 const square=document.getElementById(squareId);
 function update(){
  drawSquare(squareId,hue,sat,val);
  const c=hsvToRgb(hue,sat,val);
  setColor(which,c.r,c.g,c.b);
  if(which==='bg')hueBg=hue;else huePat=hue;
 }
 function point(e,element){
  const rect=element.getBoundingClientRect();
  return {x:(e.clientX-rect.left)/rect.width*element.width,
          y:(e.clientY-rect.top)/rect.height*element.height};
 }
 const ring=document.getElementById(hueId);
 let draggingHue=false,draggingSquare=false;
 ring.addEventListener('pointerdown',e=>{
  draggingHue=true;ring.setPointerCapture(e.pointerId);
  const p=point(e,ring);
  let a=Math.atan2(p.y-ring.height/2,p.x-ring.width/2)*180/Math.PI;
  hue=(a+360)%360;update();
 });
 ring.addEventListener('pointermove',e=>{
  if(!draggingHue)return;
  const p=point(e,ring);
  hue=(Math.atan2(p.y-ring.height/2,p.x-ring.width/2)*180/Math.PI+360)%360;
  update();
 });
 ring.addEventListener('pointerup',()=>draggingHue=false);
 square.addEventListener('pointerdown',e=>{
  draggingSquare=true;square.setPointerCapture(e.pointerId);
  const p=point(e,square);
  sat=Math.max(0,Math.min(100,p.x/square.width*100));
  val=100-Math.max(0,Math.min(100,p.y/square.height*100));
  update();
 });
 square.addEventListener('pointermove',e=>{
  if(!draggingSquare)return;
  const p=point(e,square);
  sat=Math.max(0,Math.min(100,p.x/square.width*100));
  val=100-Math.max(0,Math.min(100,p.y/square.height*100));
  update();
 });
 square.addEventListener('pointerup',()=>draggingSquare=false);

 ['R','G','B'].forEach(k=>{
  document.getElementById(which+k).addEventListener('input',()=>{
   const rgb={
    r:+document.getElementById(which+'R').value,
    g:+document.getElementById(which+'G').value,
    b:+document.getElementById(which+'B').value
   };
   const hsv=rgbToHsv(rgb.r,rgb.g,rgb.b);
   hue=hsv.h;sat=hsv.s;val=hsv.v;
   if(which==='bg')hueBg=hue;else huePat=hue;
   update();
  });
 });
 document.getElementById(hexId).addEventListener('change',e=>{
  if(!/^#[0-9a-fA-F]{6}$/.test(e.target.value))return;
  const c=hexToRgb(e.target.value);
  const hsv=rgbToHsv(c.r,c.g,c.b);
  hue=hsv.h;sat=hsv.s;val=hsv.v;update();
 });
 update();
}
setupPicker('bg');
setupPicker('pattern');

document.getElementById('openBg').onclick=()=>{
 document.getElementById('bgPicker').hidden=false;
 document.getElementById('patternPicker').hidden=true;
};
document.getElementById('openPattern').onclick=()=>{
 document.getElementById('patternPicker').hidden=false;
 document.getElementById('bgPicker').hidden=true;
};
document.querySelectorAll('[data-close]').forEach(b=>{
 b.onclick=()=>document.getElementById(b.dataset.close).hidden=true;
});
['bg','pattern'].forEach(which=>{
 document.getElementById(which+'Alpha').oninput=e=>{
  if(which==='bg')alphaBg=+e.target.value;
  else alphaPat=+e.target.value;
 };
});

function blank(){
 return Array.from({length:rows},()=>Array(n).fill(null));
}
function saveState(){
 undoStack.push(JSON.stringify(pixels));
 if(undoStack.length>40)undoStack.shift();
 redoStack=[];
}
function render(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);
 const cell=canvas.width/n,cellY=canvas.height/rows;
 if(pattern!=='plain'){
  const step=Number(document.getElementById('patternSize').value)*cell;
  ctx.save();ctx.translate(canvas.width/2,canvas.height/2);
  ctx.rotate(angle*Math.PI/180);
  ctx.translate(-canvas.width/2,-canvas.height/2);
  ctx.fillStyle=patColor;
  for(let y=-canvas.height;y<canvas.height*2;y+=step){
   for(let x=-canvas.width;x<canvas.width*2;x+=step){
    if(pattern==='dots'){
     ctx.beginPath();ctx.arc(x+step/2,y+step/2,step*.14,0,Math.PI*2);ctx.fill();
    }
    if(pattern==='check'&&(Math.floor(x/step)+Math.floor(y/step))%2===0)
     ctx.fillRect(x,y,step,step);
    if(pattern==='stripes'&&Math.floor(x/step)%2===0)
     ctx.fillRect(x,y,step,canvas.height*3);
    if(pattern==='hearts'||pattern==='stars'){
     ctx.font=`${step*.6}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
     ctx.fillText(pattern==='hearts'?'♥':'✦',x+step/2,y+step/2);
    }
   }
  }
  ctx.restore();
 }
 const scale=Number(document.getElementById('dotSize').value)/100;
 for(let y=0;y<rows;y++)for(let x=0;x<n;x++){
  if(pixels[y][x]){
   const size=cell*scale;
   ctx.fillStyle=pixels[y][x];
   ctx.fillRect(x*cell+(cell-size)/2,y*cellY+(cellY-size)/2,size,size);
  }
 }
 if(showGrid){
  ctx.strokeStyle='rgba(80,100,120,.2)';
  for(let x=0;x<=n;x++){
   ctx.beginPath();ctx.moveTo(x*cell,0);ctx.lineTo(x*cell,canvas.height);ctx.stroke();
  }
  for(let y=0;y<=rows;y++){
   ctx.beginPath();ctx.moveTo(0,y*cellY);ctx.lineTo(canvas.width,y*cellY);ctx.stroke();
  }
 }
}
function resize(){
 const f=document.getElementById('canvasFormat').value;
 const ratio={phone:16/9,desktop:9/16,tablet:3/4,square:1,wide:9/21}[f]||16/9;
 canvas.width=480;canvas.height=Math.round(480*ratio);
 rows=Math.max(4,Math.round(n*ratio));
 pixels=Array.from({length:rows},(_,y)=>Array.from({length:n},(_,x)=>pixels[y]?.[x]||null));
 render();
}
document.querySelectorAll('.tab').forEach(b=>{
 b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));
  document.getElementById('bgTools').hidden=b.dataset.tab!=='bg';
  document.getElementById('patternTools').hidden=b.dataset.tab!=='pattern';
 };
});
document.querySelectorAll('.pattern').forEach(b=>{
 b.onclick=()=>{
  pattern=b.dataset.pattern;
  document.querySelectorAll('.pattern').forEach(x=>x.classList.toggle('selected',x===b));
  render();
 };
});
document.getElementById('patternSize').oninput=e=>{
 document.getElementById('sizeLabel').textContent=e.target.value+'칸';render();
};
document.getElementById('patternAngle').oninput=e=>{
 angle=+e.target.value;
 document.getElementById('angleLabel').textContent=angle+'°';render();
};
document.getElementById('gridSize').oninput=e=>{
 n=+e.target.value;
 document.getElementById('gridLabel').textContent=n+'개';
 pixels=blank();resize();
};
document.getElementById('dotSize').oninput=e=>{
 document.getElementById('dotSizeLabel').textContent=e.target.value+'%';render();
};
document.getElementById('canvasFormat').onchange=resize;

canvas.addEventListener('pointerdown',e=>{
 saveState();paint(e);
});
function paint(e){
 const r=canvas.getBoundingClientRect();
 const x=Math.floor((e.clientX-r.left)/r.width*n);
 const y=Math.floor((e.clientY-r.top)/r.height*rows);
 if(x<0||y<0||x>=n||y>=rows)return;
 pixels[y][x]=patColor;render();
}
document.getElementById('undo').onclick=()=>{
 if(!undoStack.length)return;
 redoStack.push(JSON.stringify(pixels));
 pixels=JSON.parse(undoStack.pop());render();
};
document.getElementById('redo').onclick=()=>{
 if(!redoStack.length)return;
 undoStack.push(JSON.stringify(pixels));
 pixels=JSON.parse(redoStack.pop());render();
};
document.getElementById('gridToggle').onclick=e=>{
 showGrid=!showGrid;
 e.target.textContent=showGrid?'격자 끄기':'격자 켜기';render();
};
document.getElementById('clear').onclick=()=>{
 saveState();pixels=blank();render();
};

const KEY='crongStudioProjects';
function projects(){
 try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}
}
function refresh(){
 const select=document.getElementById('savedProjects');
 select.innerHTML='<option value="">저장된 작품 선택</option>';
 Object.entries(projects()).forEach(([id,p])=>{
  const o=document.createElement('option');o.value=id;o.textContent=p.name;select.appendChild(o);
 });
}
function snapshot(){
 return {bg,patColor,pattern,n,rows,pixels,angle,
  patternSize:document.getElementById('patternSize').value,
  dotSize:document.getElementById('dotSize').value,
  format:document.getElementById('canvasFormat').value};
}
document.getElementById('saveProject').onclick=()=>{
 const name=document.getElementById('projectName').value.trim();
 if(!name){document.getElementById('saveStatus').textContent='작품 이름을 입력해 주세요.';return}
 const data=projects(),id='p'+Date.now();
 data[id]={name,data:snapshot()};
 localStorage.setItem(KEY,JSON.stringify(data));refresh();
 document.getElementById('savedProjects').value=id;
 document.getElementById('saveStatus').textContent='작품을 저장했어요.';
};
document.getElementById('loadProject').onclick=()=>{
 const p=projects()[document.getElementById('savedProjects').value];
 if(!p)return;
 const d=p.data;
 bg=d.bg;patColor=d.patColor;pattern=d.pattern;n=d.n;rows=d.rows;
 pixels=d.pixels;angle=d.angle;
 document.getElementById('patternSize').value=d.patternSize;
 document.getElementById('dotSize').value=d.dotSize;
 document.getElementById('canvasFormat').value=d.format;
 resize();render();
 document.getElementById('saveStatus').textContent='작품을 불러왔어요.';
};
document.getElementById('deleteProject').onclick=()=>{
 const id=document.getElementById('savedProjects').value;
 if(!id)return;
 const d=projects();delete d[id];localStorage.setItem(KEY,JSON.stringify(d));refresh();
};
function download(){
 render();
 const a=document.createElement('a');
 a.download='crong-studio.png';a.href=canvas.toDataURL('image/png');a.click();
}
document.getElementById('download').onclick=download;
document.getElementById('downloadTop').onclick=download;

pixels=blank();
refresh();
render();
</script>
</body>
</html>

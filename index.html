
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crong Studio</title>
<style>
:root {
  --navy: #202b49;
  --navy-light: #344363;
  --butter: #f7e9b5;
  --cream: #fffaf0;
  --white: #ffffff;
  --text: #28334d;
  --muted: #85899a;
  --line: #e8dfc8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--text);
  font-family: Arial, "Noto Sans KR", sans-serif;
}
header {
  background: var(--navy);
  color: var(--butter);
  padding: 17px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -1px;
}
.share {
  background: var(--butter);
  color: var(--navy);
  border: 0;
  border-radius: 20px;
  padding: 9px 15px;
  font-weight: bold;
}
main {
  width: min(100% - 24px, 900px);
  margin: 22px auto;
}
h2 { color: var(--navy); }
.panel {
  background: white;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 15px;
  box-shadow: 0 4px 14px #202b490c;
}
.panel h3 {
  margin: 0 0 13px;
  color: var(--navy);
}
button, select, input {
  font: inherit;
}
button {
  cursor: pointer;
}
.menu-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.menu-buttons button, .action {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--cream);
  color: var(--navy);
  padding: 10px 13px;
}
.menu-buttons button.active {
  background: var(--navy);
  color: var(--butter);
}
label {
  display: block;
  margin: 12px 0 6px;
  font-size: 14px;
  font-weight: bold;
}
input[type="range"] { width: 100%; }
input[type="color"] {
  width: 48px;
  height: 36px;
  border: 0;
  background: transparent;
}
select {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--cream);
  color: var(--navy);
}
#previewArea {
  background: #e9e5da;
  border-radius: 16px;
  padding: 15px;
  display: grid;
  place-items: center;
  overflow: hidden;
}
canvas {
  display: block;
  max-width: 100%;
  height: auto;
  background: white;
  border-radius: 4px;
  box-shadow: 0 5px 20px #0002;
}
footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 25px;
}
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="logo">Crong Studio ♡</div>
  <button class="share" id="shareBtn">링크 공유 ↗</button>
</header>

<main>
  <h2>나만의 패턴 배경화면 만들기</h2>

  <section class="panel">
    <h3>① 화면 크기</h3>
    <select id="sizeSelect">
      <option value="phone">휴대폰 배경화면</option>
      <option value="pc">PC 배경화면</option>
      <option value="tablet">태블릿 배경화면</option>
      <option value="square">정사각형</option>
      <option value="wide">와이드</option>
    </select>
  </section>

  <section class="panel">
    <h3>② 패턴 선택</h3>
    <div class="menu-buttons" id="patternButtons">
      <button class="active" data-pattern="plain">기본</button>
      <button data-pattern="dots">도트</button>
      <button data-pattern="check">체크</button>
      <button data-pattern="stripes">줄무늬</button>
      <button data-pattern="hearts">하트</button>
      <button data-pattern="stars">별</button>
    </div>
  </section>

  <section class="panel">
    <h3>③ 색상 설정</h3>
    <label>배경 색상</label>
    <input type="color" id="bgColor" value="#f7e9b5">
    <label>패턴 색상</label>
    <input type="color" id="patternColor" value="#202b49">
  </section>

  <section class="panel">
    <h3>④ 패턴 조절</h3>
    <label>패턴 크기 <span id="sizeValue">35</span></label>
    <input type="range" id="patternSize" min="10" max="100" value="35">
    <label>패턴 방향 <span id="angleValue">0°</span></label>
    <input type="range" id="patternAngle" min="0" max="360" value="0">
  </section>

  <section class="panel">
    <h3>⑤ 미리보기</h3>
    <div id="previewArea">
      <canvas id="canvas" width="540" height="960"></canvas>
    </div>
  </section>

  <section class="panel">
    <h3>⑥ 작품 저장</h3>
    <button class="action" id="saveProject">작품 보관함에 저장 ♡</button>
    <button class="action" id="downloadBtn">PNG로 저장 ↓</button>
    <div id="savedWorks"></div>
  </section>
</main>

<footer>Crong Studio · Make your own pattern ♡</footer>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const bgColor = document.getElementById("bgColor");
const patternColor = document.getElementById("patternColor");
const patternSize = document.getElementById("patternSize");
const patternAngle = document.getElementById("patternAngle");
const sizeSelect = document.getElementById("sizeSelect");

let currentPattern = "plain";

const sizes = {
  phone: [540, 960],
  pc: [1200, 675],
  tablet: [900, 1200],
  square: [900, 900],
  wide: [1200, 500]
};

function drawHeart(x, y, size) {
  ctx.beginPath();
  ctx.moveTo(x, y + size * 0.3);
  ctx.bezierCurveTo(
    x - size, y - size * 0.4,
    x - size * 0.5, y - size,
    x, y - size * 0.4
  );
  ctx.bezierCurveTo(
    x + size * 0.5, y - size,
    x + size, y - size * 0.4,
    x, y + size * 0.3
  );
  ctx.fill();
}

function drawStar(x, y, size) {
  ctx.beginPath();

  for (let i = 0; i < 10; i++) {
    const radius = i % 2 === 0 ? size : size * 0.45;
    const angle = -Math.PI / 2 + i * Math.PI / 5;
    const px = x + Math.cos(angle) * radius;
    const py = y + Math.sin(angle) * radius;

    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }

  ctx.closePath();
  ctx.fill();
}

function drawPattern() {
  const [width, height] = sizes[sizeSelect.value];

  canvas.width = width;
  canvas.height = height;

  ctx.fillStyle = bgColor.value;
  ctx.fillRect(0, 0, width, height);

  if (currentPattern === "plain") return;

  const gap = Number(patternSize.value) * 2;
  const size = Number(patternSize.value) / 2;

  ctx.save();
  ctx.translate(width / 2, height / 2);
  ctx.rotate(Number(patternAngle.value) * Math.PI / 180);
  ctx.translate(-width / 2, -height / 2);

  ctx.fillStyle = patternColor.value;
  ctx.strokeStyle = patternColor.value;
  ctx.lineWidth = Math.max(2, size / 3);

  const diagonal = Math.sqrt(width * width + height * height);
  const startX = width / 2 - diagonal;
  const endX = width / 2 + diagonal;
  const startY = height / 2 - diagonal;
  const endY = height / 2 + diagonal;

  if (currentPattern === "stripes") {
    for (let x = startX; x < endX; x += gap) {
      ctx.fillRect(x, startY, size, diagonal * 2);
    }
  } else {
    for (let y = startY; y < endY; y += gap) {
      for (let x = startX; x < endX; x += gap) {
        if (currentPattern === "dots") {
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        } else if (currentPattern === "check") {
          ctx.fillRect(x, y, gap / 2, gap / 2);
        } else if (currentPattern === "hearts") {
          drawHeart(x, y, size);
        } else if (currentPattern === "stars") {
          drawStar(x, y, size);
        }
      }
    }
  }

  ctx.restore();
}

document.querySelectorAll("[data-pattern]").forEach(button => {
  button.addEventListener("click", () => {
    currentPattern = button.dataset.pattern;

    document.querySelectorAll("[data-pattern]").forEach(item => {
      item.classList.toggle("active", item === button);
    });

    drawPattern();
  });
});

[bgColor, patternColor, patternSize, patternAngle, sizeSelect]
  .forEach(input => {
    input.addEventListener("input", () => {
      document.getElementById("sizeValue").textContent =
        patternSize.value;

      document.getElementById("angleValue").textContent =
        patternAngle.value + "°";

      drawPattern();
    });
  });

document.getElementById("downloadBtn").addEventListener("click", () => {
  const link = document.createElement("a");
  link.download = "crong-studio-wallpaper.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
});

document.getElementById("shareBtn").addEventListener("click", async () => {
  const url = "https://croooong.github.io/crong-studio/";

  if (navigator.share) {
    try {
      await navigator.share({
        title: "Crong Studio",
        url: url
      });
    } catch (error) {}
  } else if (navigator.clipboard) {
    try {
      await navigator.clipboard.writeText(url);
      alert("사이트 주소를 복사했어요!");
    } catch (error) {
      prompt("사이트 주소를 복사해 주세요.", url);
    }
  } else {
    prompt("사이트 주소를 복사해 주세요.", url);
  }
});

function getProject() {
  return {
    background: bgColor.value,
    patternColor: patternColor.value,
    patternSize: patternSize.value,
    patternAngle: patternAngle.value,
    size: sizeSelect.value,
    pattern: currentPattern
  };
}

function applyProject(project) {
  bgColor.value = project.background;
  patternColor.value = project.patternColor;
  patternSize.value = project.patternSize;
  patternAngle.value = project.patternAngle;
  sizeSelect.value = project.size;
  currentPattern = project.pattern;

  document.querySelectorAll("[data-pattern]").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.pattern === currentPattern
    );
  });

  document.getElementById("sizeValue").textContent =
    patternSize.value;

  document.getElementById("angleValue").textContent =
    patternAngle.value + "°";

  drawPattern();
}

function showSavedWorks() {
  const container = document.getElementById("savedWorks");

  const works = JSON.parse(
    localStorage.getItem("crongWorks") || "[]"
  );

  container.innerHTML = "";

  works.forEach((work, index) => {
    const row = document.createElement("div");

    row.style.cssText =
      "display:flex;gap:8px;align-items:center;margin-top:10px;";

    const load = document.createElement("button");
    load.className = "action";
    load.textContent = "작품 " + (index + 1) + " 불러오기";

    load.addEventListener("click", () => {
      applyProject(work);
    });

    const remove = document.createElement("button");
    remove.className = "action";
    remove.textContent = "삭제";

    remove.addEventListener("click", () => {
      works.splice(index, 1);

      localStorage.setItem(
        "crongWorks",
        JSON.stringify(works)
      );

      showSavedWorks();
    });

    row.append(load, remove);
    container.appendChild(row);
  });
}

document.getElementById("saveProject").addEventListener("click", () => {
  const works = JSON.parse(
    localStorage.getItem("crongWorks") || "[]"
  );

  works.unshift(getProject());

  localStorage.setItem(
    "crongWorks",
    JSON.stringify(works.slice(0, 30))
  );

  showSavedWorks();
  alert("작품을 보관함에 저장했어요!");
});

showSavedWorks();
drawPattern();
</script>

</body>
</html>

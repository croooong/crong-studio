
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crong Studio</title>

<style>
:root {
  --lemon: #FFF59D;
  --mint: #CFF8EF;
  --pink: #F8C8E0;
  --white: #FFFEFA;
  --ink: #62566B;
  --line: #E9E3E9;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--mint);
  color: var(--ink);
  font-family: Arial, "Noto Sans KR", sans-serif;
}

button, select, input {
  font: inherit;
}

button {
  cursor: pointer;
}

header {
  min-height: 76px;
  padding: 15px 22px;
  background: var(--lemon);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-radius: 0 0 18px 18px;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: -1px;
}

.share {
  border: 1px solid #EBAFD0;
  background: var(--pink);
  color: var(--ink);
  border-radius: 22px;
  padding: 11px 18px;
  font-weight: bold;
}

main {
  width: min(100% - 24px, 1100px);
  margin: 18px auto 30px;
}

.workspace {
  display: grid;
  grid-template-columns: minmax(240px, 310px) minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}

.controls {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.panel {
  background: var(--white);
  border: 1px solid #E5F2EE;
  border-radius: 22px;
  padding: 17px;
}

.panel h3 {
  margin: 0 0 15px;
  font-size: 19px;
  color: var(--ink);
}

.pattern-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.pattern-button {
  min-height: 85px;
  padding: 10px 5px;
  border: 2px solid var(--line);
  background: #FFFFFF;
  border-radius: 15px;
  color: var(--ink);
  font-weight: bold;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.pattern-button.active {
  border: 3px solid var(--pink);
  background: #FFF6FB;
}

.pattern-symbol {
  font-size: 25px;
  line-height: 1;
}

label {
  display: block;
  margin: 13px 0 7px;
  font-size: 14px;
  font-weight: bold;
}

.range-line {
  display: flex;
  align-items: center;
  gap: 10px;
}

input[type="range"] {
  flex: 1;
  min-width: 0;
  accent-color: #E99AC7;
}

.value {
  min-width: 48px;
  padding: 7px;
  text-align: center;
  background: #FFFFFF;
  border: 1px solid var(--line);
  border-radius: 18px;
}

select {
  width: 100%;
  padding: 11px;
  background: #FFFFFF;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 12px;
}

.color-pair {
  display: flex;
  justify-content: space-around;
  gap: 20px;
}

.color-choice {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.color-choice input[type="color"] {
  appearance: none;
  -webkit-appearance: none;
  width: 62px;
  height: 62px;
  padding: 0;
  border: 3px solid var(--ink);
  border-radius: 50%;
  overflow: hidden;
  background: transparent;
  cursor: pointer;
}

.color-choice input[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.color-choice input[type="color"]::-webkit-color-swatch {
  border: none;
  border-radius: 50%;
}

.color-choice input[type="color"]::-moz-color-swatch {
  border: none;
  border-radius: 50%;
}

.color-choice span {
  font-size: 14px;
  font-weight: bold;
}

.preview-panel {
  min-width: 0;
}

#previewArea {
  background: #FFFFFF;
  border: 2px solid #DDF1EA;
  border-radius: 20px;
  padding: 10px;
  display: grid;
  place-items: center;
  overflow: hidden;
}

#canvas {
  display: block;
  max-width: 100%;
  height: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
}

.mini-preview {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 1000;
  width: 104px;
  padding: 7px;
  background: #FFFFFF;
  border: 2px solid var(--pink);
  border-radius: 13px;
  box-shadow: 0 3px 15px #62566B22;
  text-align: center;
}

.mini-preview.hidden {
  display: none;
}

.mini-preview span {
  display: block;
  font-size: 11px;
  font-weight: bold;
  margin-bottom: 5px;
}

#miniCanvas {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 5px;
}

.works-panel {
  margin-top: 14px;
}

.works-title {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 13px;
}

.works-layout {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
}

.savedWorks {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  flex: 1;
}

.saved-item {
  width: 66px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.saved-thumb {
  width: 66px;
  height: 76px;
  object-fit: cover;
  border: 1px solid var(--line);
  border-radius: 8px;
}

.saved-item button {
  border: 0;
  padding: 5px 2px;
  border-radius: 7px;
  background: var(--mint);
  color: var(--ink);
  font-size: 11px;
}

.action {
  border: 1px solid #E9D77A;
  background: var(--lemon);
  color: var(--ink);
  border-radius: 13px;
  padding: 12px 15px;
  font-weight: bold;
}

.delete-all {
  background: var(--pink);
  border-color: #EBAFD0;
}

footer {
  margin: 28px 12px 12px;
  padding: 19px 10px;
  text-align: center;
  background: #DDF9F2;
  border: 1px solid #B9EDE1;
  border-radius: 22px;
  color: var(--ink);
  font-size: 14px;
}

@media (max-width: 700px) {
  .workspace {
    grid-template-columns: 1fr;
  }

  .controls {
    order: 1;
  }

  .preview-panel {
    order: 2;
  }

  .logo {
    font-size: 21px;
  }

  header {
    padding: 13px 14px;
  }

  .share {
    padding: 9px 13px;
    font-size: 13px;
  }

  .mini-preview {
    width: 84px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Crong Studio</div>
  <button class="share" id="shareBtn">공유하기</button>
</header>

<div class="mini-preview hidden" id="miniPreview">
  <span>미리보기</span>
  <canvas id="miniCanvas" width="90" height="160"></canvas>
</div>

<main>
  <div class="workspace">

    <div class="controls">

      <section class="panel">
        <h3>① 패턴 선택</h3>
        <div class="pattern-grid" id="patternButtons">
          <button class="pattern-button active" data-pattern="plain">
            <span class="pattern-symbol">▪ ▪</span>
            기본
          </button>
          <button class="pattern-button" data-pattern="dots">
            <span class="pattern-symbol">⠿</span>
            도트
          </button>
          <button class="pattern-button" data-pattern="check">
            <span class="pattern-symbol">▦</span>
            체크
          </button>
          <button class="pattern-button" data-pattern="stripes">
            <span class="pattern-symbol">▨</span>
            줄무늬
          </button>
          <button class="pattern-button" data-pattern="hearts">
            <span class="pattern-symbol">♥</span>
            하트
          </button>
          <button class="pattern-button" data-pattern="stars">
            <span class="pattern-symbol">★</span>
            별
          </button>
        </div>
      </section>

      <section class="panel">
        <h3>② 크기 &amp; 방향</h3>

        <label for="patternSize">패턴 크기</label>
        <div class="range-line">
          <input type="range" id="patternSize"
            min="10" max="100" value="30">
          <span class="value" id="sizeValue">30</span>
        </div>

        <label for="patternAngle">패턴 방향</label>
        <div class="range-line">
          <input type="range" id="patternAngle"
            min="0" max="360" value="0">
          <span class="value" id="angleValue">0°</span>
        </div>

        <label for="sizeSelect">미리보기 크기</label>
        <select id="sizeSelect">
          <option value="phone">휴대폰 크기</option>
          <option value="pc">PC 크기</option>
          <option value="tablet">태블릿 크기</option>
          <option value="square">정사각형</option>
          <option value="wide">와이드</option>
        </select>
      </section>

      <section class="panel">
        <h3>③ 색상 설정</h3>

        <div class="color-pair">
          <label class="color-choice">
            <input type="color" id="bgColor" value="#FFF59D">
            <span>배경색</span>
          </label>

          <label class="color-choice">
            <input type="color" id="patternColor" value="#F8C8E0">
            <span>무늬색</span>
          </label>
        </div>
      </section>

    </div>

    <section class="panel preview-panel" id="mainPreview">
      <h3>미리보기</h3>
      <div id="previewArea">
        <canvas id="canvas" width="540" height="960"></canvas>
      </div>
    </section>

  </div>

  <section class="panel works-panel">
    <div class="works-title">내 작품 보관함</div>

    <div class="works-layout">
      <div class="savedWorks" id="savedWorks"></div>

      <button class="action" id="saveProject">
        현재 작품 저장
      </button>

      <button class="action delete-all" id="downloadBtn">
        PNG 저장
      </button>
    </div>
  </section>
</main>

<footer>
  Crong Studio · Make your own pattern
</footer>
<script>
const canvas = document.getElementById("canvas");
const miniCanvas = document.getElementById("miniCanvas");

const bgColor = document.getElementById("bgColor");
const patternColor = document.getElementById("patternColor");
const patternSize = document.getElementById("patternSize");
const patternAngle = document.getElementById("patternAngle");
const sizeSelect = document.getElementById("sizeSelect");

const ctx = canvas.getContext("2d");
const miniCtx = miniCanvas.getContext("2d");

let currentPattern = "plain";

const sizes = {
  phone: [540, 960],
  pc: [1200, 675],
  tablet: [900, 1200],
  square: [900, 900],
  wide: [1200, 500]
};

function drawHeart(context, x, y, size) {
  context.beginPath();
  context.moveTo(x, y + size * 0.35);

  context.bezierCurveTo(
    x - size * 1.3, y - size * 0.5,
    x - size * 0.7, y - size * 1.2,
    x, y - size * 0.35
  );

  context.bezierCurveTo(
    x + size * 0.7, y - size * 1.2,
    x + size * 1.3, y - size * 0.5,
    x, y + size * 0.35
  );

  context.fill();
}

function drawStar(context, x, y, size) {
  context.beginPath();

  for (let i = 0; i < 10; i++) {
    const radius = i % 2 === 0 ? size : size * 0.45;
    const angle = -Math.PI / 2 + i * Math.PI / 5;

    const px = x + Math.cos(angle) * radius;
    const py = y + Math.sin(angle) * radius;

    if (i === 0) context.moveTo(px, py);
    else context.lineTo(px, py);
  }

  context.closePath();
  context.fill();
}

function renderPattern(context, width, height) {
  context.clearRect(0, 0, width, height);

  context.fillStyle = bgColor.value;
  context.fillRect(0, 0, width, height);

  if (currentPattern === "plain") return;

  const gap = Number(patternSize.value) * 2;
  const size = Number(patternSize.value) / 2;

  context.save();

  context.translate(width / 2, height / 2);
  context.rotate(Number(patternAngle.value) * Math.PI / 180);
  context.translate(-width / 2, -height / 2);

  context.fillStyle = patternColor.value;

  const diagonal = Math.sqrt(width * width + height * height);

  const startX = width / 2 - diagonal;
  const endX = width / 2 + diagonal;
  const startY = height / 2 - diagonal;
  const endY = height / 2 + diagonal;

  if (currentPattern === "stripes") {
    for (let x = startX; x < endX; x += gap) {
      context.fillRect(
        x,
        startY,
        size,
        diagonal * 2
      );
    }
  } else {
    for (let y = startY; y < endY; y += gap) {
      for (let x = startX; x < endX; x += gap) {

        if (currentPattern === "dots") {
          context.beginPath();
          context.arc(x, y, size, 0, Math.PI * 2);
          context.fill();

        } else if (currentPattern === "check") {
          const cell = gap / 2;

          const column = Math.round((x - startX) / gap);
          const row = Math.round((y - startY) / gap);

          context.fillRect(
            x,
            y,
            cell,
            cell
          );

          if ((column + row) % 2 === 0) {
            context.fillRect(
              x + cell,
              y + cell,
              cell,
              cell
            );
          }

        } else if (currentPattern === "hearts") {
          drawHeart(context, x, y, size);

        } else if (currentPattern === "stars") {
          drawStar(context, x, y, size);
        }
      }
    }
  }

  context.restore();
}

function drawPattern() {
  const [width, height] = sizes[sizeSelect.value];

  canvas.width = width;
  canvas.height = height;

  renderPattern(ctx, width, height);

  const miniWidth = 90;
  const miniHeight = Math.round(
    miniWidth * height / width
  );

  miniCanvas.width = miniWidth;
  miniCanvas.height = miniHeight;

  renderPattern(miniCtx, miniWidth, miniHeight);
}

function updateValues() {
  document.getElementById("sizeValue").textContent =
    patternSize.value;

  document.getElementById("angleValue").textContent =
    patternAngle.value + "°";
}

document.querySelectorAll("[data-pattern]").forEach(button => {
  button.addEventListener("click", () => {
    currentPattern = button.dataset.pattern;

    document.querySelectorAll("[data-pattern]").forEach(item => {
      item.classList.toggle("active", item === button);
    });

    drawPattern();
  });
});

[
  bgColor,
  patternColor,
  patternSize,
  patternAngle,
  sizeSelect
].forEach(input => {
  input.addEventListener("input", () => {
    updateValues();
    drawPattern();
  });

  input.addEventListener("change", () => {
    updateValues();
    drawPattern();
  });
});

const mainPreview = document.getElementById("mainPreview");
const miniPreview = document.getElementById("miniPreview");

if ("IntersectionObserver" in window) {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      miniPreview.classList.toggle(
        "hidden",
        entry.isIntersecting
      );
    });
  }, {
    threshold: 0.15
  });

  observer.observe(mainPreview);
}

document.getElementById("shareBtn").addEventListener(
  "click",
  async () => {
    const url = "https://croooong.github.io/crong-studio/";

    if (navigator.share) {
      try {
        await navigator.share({
          title: "Crong Studio",
          url: url
        });
      } catch (error) {}
    } else {
      try {
        await navigator.clipboard.writeText(url);
        alert("사이트 주소를 복사했어요!");
      } catch (error) {
        prompt("사이트 주소를 복사해 주세요.", url);
      }
    }
  }
);

function getProject() {
  return {
    background: bgColor.value,
    patternColor: patternColor.value,
    patternSize: patternSize.value,
    patternAngle: patternAngle.value,
    size: sizeSelect.value,
    pattern: currentPattern
  };
}

function applyProject(project) {
  bgColor.value = project.background;
  patternColor.value = project.patternColor;
  patternSize.value = project.patternSize;
  patternAngle.value = project.patternAngle;
  sizeSelect.value = project.size;
  currentPattern = project.pattern;

  document.querySelectorAll("[data-pattern]").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.pattern === currentPattern
    );
  });

  updateValues();
  drawPattern();
}

function getSavedWorks() {
  try {
    return JSON.parse(
      localStorage.getItem("crongWorks") || "[]"
    );
  } catch (error) {
    return [];
  }
}

function showSavedWorks() {
  const container = document.getElementById("savedWorks");
  const works = getSavedWorks();

  container.innerHTML = "";

  works.forEach((work, index) => {
    const item = document.createElement("div");
    item.className = "saved-item";

    const thumbnail = document.createElement("img");
    thumbnail.className = "saved-thumb";
    thumbnail.alt = "저장한 작품 " + (index + 1);

    if (work.preview) {
      thumbnail.src = work.preview;
    } else {
      thumbnail.style.background = work.background;
    }

    const loadButton = document.createElement("button");
    loadButton.textContent = "불러오기";

    loadButton.addEventListener("click", () => {
      applyProject(work);
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "삭제";

    deleteButton.addEventListener("click", () => {
      const updated = getSavedWorks();
      updated.splice(index, 1);

      localStorage.setItem(
        "crongWorks",
        JSON.stringify(updated)
      );

      showSavedWorks();
    });

    item.appendChild(thumbnail);
    item.appendChild(loadButton);
    item.appendChild(deleteButton);

    container.appendChild(item);
  });
}

document.getElementById("saveProject").addEventListener(
  "click",
  () => {
    const works = getSavedWorks();

    const project = getProject();
    project.preview = canvas.toDataURL("image/png");

    works.unshift(project);

    try {
      localStorage.setItem(
        "crongWorks",
        JSON.stringify(works.slice(0, 10))
      );

      showSavedWorks();
      alert("작품을 저장했어요!");
    } catch (error) {
      alert("저장 공간이 부족해요. 기존 작품을 정리해 주세요.");
    }
  }
);

document.getElementById("downloadBtn").addEventListener(
  "click",
  () => {
    const link = document.createElement("a");

    link.download = "crong-studio-wallpaper.png";
    link.href = canvas.toDataURL("image/png");

    link.click();
  }
);

updateValues();
showSavedWorks();
drawPattern();
</script>

</body>
</html>

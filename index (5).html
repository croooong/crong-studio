<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>작은 농장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:#3d2b1b; --edge:#5a4128; --text:#f3e7c4; --gold:#ffd25e; --leaf:#7bc46b;
    --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
    --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:'Jua',system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{position:fixed;top:0;left:0;image-rendering:pixelated;image-rendering:crisp-edges}
  .chip{background:rgba(43,29,20,.82);border:2px solid var(--edge);border-radius:10px;padding:2px 9px;font-size:14px;line-height:1.4}
  .chip b{color:var(--gold);font-weight:normal}
  #hud{position:fixed;left:calc(8px + var(--sl));top:calc(8px + var(--st));display:flex;flex-direction:column;gap:4px;align-items:flex-start;pointer-events:none}
  #topr{position:fixed;right:calc(8px + var(--sr));top:calc(8px + var(--st));display:flex;gap:6px}
  #topr button{font:inherit;font-size:18px;color:var(--text);background:rgba(43,29,20,.82);border:2px solid var(--edge);border-radius:10px;width:40px;height:36px;cursor:pointer}
  #toast{position:fixed;left:50%;top:calc(10px + var(--st));transform:translateX(-50%);background:rgba(43,29,20,.92);border:2px solid var(--edge);
    border-radius:8px;padding:5px 14px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
  #toast.on{opacity:1}
  #hotbar{position:fixed;left:50%;bottom:calc(8px + var(--sb));transform:translateX(-50%);display:flex;gap:5px;padding:5px;
    background:rgba(43,29,20,.78);border:2px solid var(--edge);border-radius:12px}
  .slot{position:relative;width:46px;height:46px;border:3px solid var(--edge);border-radius:9px;background:#3d2b1b;padding:0;cursor:pointer}
  .slot.sel{border-color:var(--gold);background:#5a3b1f}
  .slot img{width:30px;height:30px;image-rendering:pixelated;display:block;margin:auto}
  .slot i{position:absolute;left:3px;top:0;font:11px 'Jua',sans-serif;font-style:normal;color:#f3e7c4}
  .slot .ic{position:absolute;right:1px;top:-3px;font-size:14px}
  .slot em{position:absolute;right:3px;bottom:0;font:11px 'Jua',sans-serif;font-style:normal;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}

  #stick{position:fixed;left:calc(22px + var(--sl));bottom:calc(18px + var(--sb));width:104px;height:104px;border-radius:50%;
    background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.38);touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:rgba(255,255,255,.55);box-shadow:0 2px 6px rgba(0,0,0,.35);pointer-events:none}
  #act{position:fixed;right:calc(26px + var(--sr));bottom:calc(24px + var(--sb));width:78px;height:78px;border-radius:50%;font:inherit;font-size:19px;color:#fff;
    background:rgba(255,210,94,.3);border:3px solid rgba(255,255,255,.55);touch-action:none}
  #act:active{background:rgba(255,210,94,.6)}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:10px;z-index:10}
  .modal[hidden]{display:none}
  .card{width:min(100%,780px);max-height:94vh;overflow:auto;background:var(--panel);border:3px solid var(--edge);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y}
  .shead{display:flex;align-items:center;gap:10px;font-size:20px}
  .shead .gold{margin-left:auto;color:var(--gold);font-size:16px}
  .x{font:inherit;font-size:15px;color:var(--text);background:#2f2013;border:2px solid var(--edge);border-radius:8px;padding:4px 12px;cursor:pointer}
  .stabs{display:flex;gap:8px}
  .stabs button{flex:1;font:inherit;font-size:16px;color:var(--text);background:#2f2013;border:2px solid var(--edge);border-radius:8px;padding:5px;cursor:pointer}
  .stabs button.on{border-color:var(--gold);background:#54391f}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
  .row{display:flex;align-items:center;gap:10px;background:#2f2013;border:2px solid var(--edge);border-radius:10px;padding:6px 8px}
  .ico{font-size:26px;width:34px;text-align:center}
  .info{flex:1;min-width:0;line-height:1.25;font-size:15px}
  .info small{display:block;opacity:.75;font-size:12px}
  .btns{display:flex;flex-direction:column;gap:5px}
  .btns button{font:inherit;font-size:13px;color:#2b1d14;background:var(--gold);border:0;border-radius:8px;padding:4px 9px;cursor:pointer;white-space:nowrap}
  .btns button:disabled{opacity:.35;cursor:default}
  #smsg,#bsum{min-height:1.2em;text-align:center;font-size:14px;color:var(--leaf)}

  #rotate{position:fixed;inset:0;background:#2b1d14;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20;font-size:22px;text-align:center}
  #rotate span{font-size:60px}
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="chip">🗓 <b id="hDay">1</b>일차 · <span id="hSeason"></span> · 🕒 <b id="hTime">06:00</b></div>
  <div class="chip">🪙 <b id="hGold">0</b> · 🎒 <b id="hBag">0</b></div>
</div>
<div id="topr"><button id="bBag" aria-label="가방">🎒</button><button id="bFs" aria-label="전체화면">⛶</button></div>
<div id="toast"></div>
<div id="hotbar"></div>
<div id="stick" aria-label="이동 조이스틱"><div id="knob"></div></div>
<button id="act" aria-label="행동">행동</button>

<div id="shop" class="modal" hidden>
  <div class="card" role="dialog" aria-label="상점">
    <div class="shead"><span>🏪 상점</span><span class="gold">🪙 <b id="sGold">0</b></span><button class="x" id="sClose">닫기</button></div>
    <div class="stabs"><button data-t="seed" class="on">씨앗</button><button data-t="tool">도구</button></div>
    <div id="slist" class="grid"></div>
    <div id="smsg"></div>
  </div>
</div>

<div id="bag" class="modal" hidden>
  <div class="card" role="dialog" aria-label="가방">
    <div class="shead"><span>🎒 가방</span><span class="gold">🪙 <b id="bGold">0</b></span><button class="x" id="bClose">닫기</button></div>
    <div id="blist" class="grid"></div>
    <div id="bsum"></div>
  </div>
</div>

<div id="rotate"><span>📱↔️</span>가로로 돌려서 플레이해 주세요</div>

<script>
(() => {
  'use strict';
  const T = 16, FW = 44, FH = 32, MW = 32, MH = 22;
  let W = FW, H = FH;
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  let NOW = 0;

  // ================= 데이터 =================
  const GRASS = 0, SOIL = 1, HOUSE = 2, BOX = 3, POND = 4, SHOP = 5, MOUNTAIN = 6, SEA = 7, SAND = 8, TREE = 9, CAVE = 10;
  const FLOOR = 20, WALLM = 21, ROCK = 22, COPPER = 23, IRON = 24, GOLD = 25, CRYSTAL = 26, LUP = 27, LDOWN = 28;
  const SOLID = new Set([HOUSE, BOX, POND, SHOP, MOUNTAIN, SEA, TREE, CAVE, WALLM, ROCK, COPPER, IRON, GOLD, CRYSTAL, LUP, LDOWN]);
  const DAY_START = 360, DAY_END = 1440, SEC_PER_DAY = 150;

  // 실제 현재 계절 (북반구 기준: 3~5 봄, 6~8 여름, 9~11 가을, 12~2 겨울)
  const SEASON = (() => { const m = new Date().getMonth(); return m >= 2 && m <= 4 ? 'spring' : m >= 5 && m <= 7 ? 'summer' : m >= 8 && m <= 10 ? 'autumn' : 'winter'; })();
  const SN = { spring: ['봄', '🌸'], summer: ['여름', '☀️'], autumn: ['가을', '🍂'], winter: ['겨울', '❄️'] };
  const ALL = ['spring', 'summer', 'autumn', 'winter'];

  const CROPS = {
    carrot:  { name: '당근',   icon: '🥕', seed: 15, sell: 40,  days: 3, seasons: ['spring', 'autumn'] },
    potato:  { name: '감자',   icon: '🥔', seed: 25, sell: 70,  days: 4, seasons: ['spring', 'autumn'] },
    cabbage: { name: '배추',   icon: '🥬', seed: 30, sell: 90,  days: 4, seasons: ['spring', 'winter'] },
    tomato:  { name: '토마토', icon: '🍅', seed: 40, sell: 120, days: 5, seasons: ['summer'] },
    corn:    { name: '옥수수', icon: '🌽', seed: 50, sell: 150, days: 6, seasons: ['summer', 'autumn'] },
    pumpkin: { name: '호박',   icon: '🎃', seed: 60, sell: 220, days: 7, seasons: ['autumn'] }
  };
  const CROP_KEYS = Object.keys(CROPS);
  const FISH = [
    { id: 'crucian',  name: '붕어',   icon: '🐟', price: 30,  water: 'pond', seasons: ALL, w: 50, diff: 1 },
    { id: 'carp',     name: '잉어',   icon: '🐠', price: 60,  water: 'pond', seasons: ALL, w: 28, diff: 2 },
    { id: 'catfish',  name: '메기',   icon: '🐡', price: 110, water: 'pond', seasons: ['spring', 'summer', 'autumn'], w: 10, diff: 3 },
    { id: 'smelt',    name: '빙어',   icon: '🐟', price: 45,  water: 'pond', seasons: ['winter'], w: 40, diff: 1 },
    { id: 'mackerel', name: '고등어', icon: '🐟', price: 40,  water: 'sea',  seasons: ALL, w: 45, diff: 1 },
    { id: 'squid',    name: '오징어', icon: '🦑', price: 55,  water: 'sea',  seasons: ['summer', 'autumn'], w: 25, diff: 2 },
    { id: 'seabream', name: '도미',   icon: '🐠', price: 80,  water: 'sea',  seasons: ['spring', 'autumn'], w: 25, diff: 2 },
    { id: 'cod',      name: '대구',   icon: '🐟', price: 70,  water: 'sea',  seasons: ['winter'], w: 30, diff: 2 },
    { id: 'tuna',     name: '참치',   icon: '🦈', price: 220, water: 'sea',  seasons: ['summer', 'autumn'], w: 6, diff: 3 }
  ];
  const ORES = {
    stone:   { name: '돌',   icon: '🪨', price: 3 },
    copper:  { name: '구리', icon: '🟠', price: 18 },
    iron:    { name: '철',   icon: '⚙️', price: 35 },
    gold:    { name: '금',   icon: '🟡', price: 70 },
    crystal: { name: '수정', icon: '💎', price: 150 }
  };
  const ORE_OF = { [COPPER]: 'copper', [IRON]: 'iron', [GOLD]: 'gold', [CRYSTAL]: 'crystal' };
  const UPGRADES = [
    { id: 'hoe',    icon: '🌱', name: '튼튼한 호미',   desc: '한 번에 5×5칸을 갈아요',        price: 300 },
    { id: 'can',    icon: '💧', name: '큰 물뿌리개',   desc: '3×3칸에 한꺼번에 물을 줘요',     price: 400 },
    { id: 'sickle', icon: '🌾', name: '큰 낫',         desc: '5×5칸을 한 번에 수확해요',       price: 450 },
    { id: 'rod',    icon: '🎣', name: '좋은 낚싯대',   desc: '입질이 빨라지고 여유가 늘어요',   price: 350 },
    { id: 'pick',   icon: '⛏️', name: '강철 곡괭이',   desc: '광석을 한 번에 캐요',            price: 500 },
    { id: 'boots',  icon: '👢', name: '가벼운 부츠',   desc: '더 빠르게 걸어요',               price: 250 }
  ];
  const hsh = (x, y, k) => (((x * 73856093) ^ (y * 19349663) ^ (k * 83492791)) >>> 0);
  const mk = keys => Object.fromEntries(keys.map(k => [k, 0]));
  function mulberry(a) {
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }

  // ================= 농장 맵 =================
  const farmMap = Array.from({ length: FH }, () => Array(FW).fill(GRASS));
  for (let y = 0; y < FH; y++) for (let x = 0; x < FW; x++) {
    const mh = 3 + (hsh(x >> 1, 0, 5) % 3), mw = 2 + (hsh(0, y >> 1, 8) % 2);
    const ex = 37 + (hsh(0, y >> 1, 6) % 2), ey = 28 + (hsh(x >> 1, 0, 7) % 2);
    let t = GRASS;
    if (x >= ex || y >= ey) t = SEA;
    else if (x >= ex - 2 || y >= ey - 2) t = SAND;
    if (y < mh || x < mw) t = MOUNTAIN;
    farmMap[y][x] = t;
  }
  for (let y = 0; y < 5; y++) for (let x = 24; x <= 30; x++) farmMap[y][x] = MOUNTAIN;
  const BUILDINGS = [
    { t: HOUSE, x: 6,  y: 6, w: 6, h: 4 },
    { t: SHOP,  x: 14, y: 6, w: 5, h: 4 },
    { t: BOX,   x: 21, y: 8, w: 3, h: 2 },
    { t: CAVE,  x: 26, y: 3, w: 3, h: 2 }
  ];
  BUILDINGS.forEach(b => { for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) farmMap[y][x] = b.t; });
  for (let y = 15; y <= 19; y++) for (let x = 29; x <= 33; x++) farmMap[y][x] = POND;
  for (let y = 0; y < FH; y++) for (let x = 0; x < FW; x++) {
    const farmZone = x >= 3 && x <= 28 && y >= 5 && y <= 24, pondZone = x >= 27 && x <= 35 && y >= 13 && y <= 21;
    if (farmMap[y][x] === GRASS && !farmZone && !pondZone && hsh(x, y, 3) % 10 === 0) farmMap[y][x] = TREE;
  }
  let map = farmMap, scene = 'farm', mineHp = {}, floorNo = 0;

  // ================= 상태 / 저장 =================
  let s = {
    day: 1, time: DAY_START, gold: 60, tool: 0, px: 12, py: 11, face: [0, 1],
    seeds: Object.assign(mk(CROP_KEYS), { carrot: 5 }), harvest: mk(CROP_KEYS),
    fish: mk(FISH.map(f => f.id)), ore: mk(Object.keys(ORES)),
    seedSel: 'carrot', best: 0,
    up: { hoe: false, can: false, boots: false, rod: false, pick: false, sickle: false }
  };
  let plants = {};
  let rx = s.px, ry = s.py;
  const SAVE_KEY = 'small-farm-save-v4';
  function save() {
    try {
      const sv = Object.assign({}, s);
      if (scene === 'mine') { sv.px = 27; sv.py = 5; sv.face = [0, 1]; sv.tool = 0; }
      localStorage.setItem(SAVE_KEY, JSON.stringify({ s: sv, plants, map: farmMap }));
    } catch (e) {}
  }
  (function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      s = Object.assign(s, d.s); plants = d.plants || {};
      if (d.map && d.map.length === FH && d.map[0].length === FW) for (let y = 0; y < FH; y++) for (let x = 0; x < FW; x++) farmMap[y][x] = d.map[y][x];
      rx = s.px; ry = s.py;
    } catch (e) {}
  })();

  // ================= 픽셀 스프라이트 =================
  const PAL = {
    R: '#c8362f', r: '#8f2328', H: '#7d4c2c', h: '#55301b', S: '#f7dcc8', K: '#3a2318',
    W: '#f5f1e8', B: '#5577ad', b: '#3d5b8c', T: '#7b3030', O: '#a8652f',
    G: '#aab1bb', g: '#666d79', l: '#8a5a2e', L: '#c08a50',
    C: '#5aa0c8', c: '#3b7a9f', D: '#8ec9ea', P: '#c79a56', p: '#8a5f2c', Y: '#ffd25e'
  };
  function sprite(rows) {
    const c = document.createElement('canvas'); c.width = 16; c.height = 16;
    const g = c.getContext('2d');
    rows.forEach((row, y) => [...row].forEach((ch, x) => { if (PAL[ch]) { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); } }));
    return c;
  }
  function mirror(c) {
    const m = document.createElement('canvas'); m.width = 16; m.height = 16;
    const g = m.getContext('2d'); g.translate(16, 0); g.scale(-1, 1); g.drawImage(c, 0, 0);
    return m;
  }
  const BODY = ['..hHWBWWWWBWHh..', '..RRBBBBBBBBRR..', '...BBTBBBBTBB...', '...bBBBBTBBBb...'];
  const FRONT_HEAD = [
    '....rrRRRRrr....', '...rRRRRRRRRr...', '..rRRRRRRRRRRr..', '..RRRRRRRRRRRR..', '..RHHHHHHHHHHR..',
    '.hHHSSSSSSSSHHh.', '.hHSSSSSSSSSSHh.', '.hHSKKSSSSKKSHh.', '.hHSSSKSSKSSSHh.', '.hHSSSSKKSSSSHh.', '..hH.RRRRRR.Hh..'
  ];
  const BACK_HEAD = [
    '....rrRRRRrr....', '...rRRRRRRRRr...', '..rRRRRRRRRRRr..', '..RRRRRRRRRRRR..', '..RHHHHHHHHHHR..',
    '.hHHHHHHHHHHHHh.', '.hHHHHHRRHHHHHh.', '.hHHHHRRRRHHHHh.', '.hHHHHHRRHHHHHh.', '.hHHHHHHHHHHHHh.', '..hHHHHHHHHHHh..'
  ];
  const FRONT_BOOTS = ['....OO....OO....', '....OO......OO..', '....OO....OO....', '..OO......OO....'];
  const SIDE_ROWS = [
    '....rrRRRRrr....', '...rRRRRRRRRr...', '..rRRRRRRRRRRr..', '..RRRRRRRRRRRR..', '..RRHHHHHHHHHR..',
    '.SSSSSHHHHHHHh..', '.SSSSSSHHHHHHh..', '.SSKKSSHHHHHHh..', '.SKSSSSHHHHHHh..', '.SSSSSSHHHHHHh..',
    '..hRRRRRHHHHHh..', '....WBWWWWWHh...', '....BBBBBBBBRR..', '....BBTBBBBTB...', '....bBBBBBBBb...'
  ];
  const SIDE_BOOTS = ['....OOO..OO.....', '....OO...OOO....', '....OOO..OO.....', '...OOO....OO....'];
  const SPR = { down: [], up: [], left: [], right: [] };
  for (let i = 0; i < 4; i++) {
    SPR.down.push(sprite([...FRONT_HEAD, ...BODY, FRONT_BOOTS[i]]));
    SPR.up.push(sprite([...BACK_HEAD, ...BODY, FRONT_BOOTS[i]]));
    const l = sprite([...SIDE_ROWS, SIDE_BOOTS[i]]);
    SPR.left.push(l); SPR.right.push(mirror(l));
  }
  const faceName = f => f[1] > 0 ? 'down' : f[1] < 0 ? 'up' : f[0] < 0 ? 'left' : 'right';
  const E = '................';
  const rep = (row, n) => Array(n).fill(row);
  const TOOLSPR = {
    hoe: sprite([E, E, '.....GGGGG......', '.....GgGl.......', '.....g..l.......', ...rep('........l.......', 8), ...rep('........L.......', 3)]),
    sickle: sprite([E, E, '...GGGGGGG......', '...GG...l.......', '...g....l.......', ...rep('........l.......', 8), ...rep('........L.......', 3)]),
    pick: sprite([E, E, '...GGGGGGGGGGG..', '...G....l....G..', '...g....l....g..', ...rep('........l.......', 8), ...rep('........L.......', 3)]),
    rod: sprite(['........g.......', ...rep('........l.......', 11), '.......gg.......', ...rep('........L.......', 3)]),
    can: sprite([...rep(E, 6), '....gggg....CC..', '....g..g...CC...', '...DDDDDDCC.....', '...CCCCCCCC.....', '...CCCCCCCC.....', '...cccccccc.....', ...rep(E, 4)]),
    pouch: sprite([...rep(E, 5), '.......pp.......', '......pppp......', '.....PPPPPP.....', '....PPPPPPPP....', '....PPPYPPPP....', '....PPPPPPPP....', '.....pppppp.....', ...rep(E, 4)])
  };

  // ================= UI =================
  const toastEl = $('toast'); let toastT;
  function say(msg, ms) {
    if (!msg) return;
    toastEl.textContent = msg; toastEl.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), ms || 1800);
  }
  const SLOT_KEYS = ['hoe', 'can', 'pouch', 'sickle', 'rod', 'pick'];
  const SLOT_NAMES = ['호미', '물뿌리개', '씨앗', '낫', '낚싯대', '곡괭이'];
  const slotEls = SLOT_KEYS.map((k, i) => {
    const b = document.createElement('button'); b.className = 'slot'; b.title = SLOT_NAMES[i]; b.setAttribute('aria-label', SLOT_NAMES[i]);
    b.innerHTML = `<i>${i + 1}</i><img alt="" src="${TOOLSPR[k].toDataURL()}"><span class="ic"></span><em></em>`;
    b.onclick = () => selectTool(i);
    $('hotbar').appendChild(b);
    return { b, ic: b.querySelector('.ic'), em: b.querySelector('em') };
  });
  function nextSeed() {
    const i = CROP_KEYS.indexOf(s.seedSel);
    for (let j = 1; j <= CROP_KEYS.length; j++) { const k = CROP_KEYS[(i + j) % CROP_KEYS.length]; if (s.seeds[k] > 0) { s.seedSel = k; return true; } }
    return false;
  }

    rect('#c9925a', X + 2, Y + 22, w - 4, h - 22); for (let i = 10; i < w - 6; i += 9) rect('#a8723f', X + i, Y + 22, 1, h - 24);
    rect('#5a3a1c', X + 18, Y, 44, 14); rect('#7a4a24', X + 19, Y + 1, 42, 12); rect('#ffd25e', X + 22, Y + 3, 6, 6); rect('#c9a030', X + 24, Y + 5, 2, 2);
    ctx.font = 'bold 7px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#ffd25e'; ctx.fillText('SHOP', X + 31, Y + 10);
    rect('#7a4a24', X + 14, Y + 14, 2, 4); rect('#7a4a24', X + 64, Y + 14, 2, 4);
    for (let i = 0; i < w / 8; i++) {
      const c = i % 2 ? '#f5f1e8' : '#c8362f'; rect(c, X + i * 8, Y + 16, 8, 10); rect(c, X + i * 8 + 1, Y + 26, 6, 2); rect(c, X + i * 8 + 2, Y + 28, 4, 1);
    }
    rect('#7a4a24', X + 3, Y + 30, 3, h - 30); rect('#7a4a24', X + w - 6, Y + 30, 3, h - 30);
    rect('#3a2616', X + 8, Y + 30, w - 16, 16); rect('#7a4a24', X + 8, Y + 38, w - 16, 1);
    const gc = ['#e04a3c', '#ffd25e', '#6fd06a', '#5aa0c8']; for (let i = 0; i < 6; i++) { rect(gc[i % 4], X + 10 + i * 11, Y + 33, 6, 5); rect(gc[(i + 2) % 4], X + 10 + i * 11, Y + 41, 6, 4); }
    rect('#c8362f', X + 36, Y + 31, 8, 3); rect('#f7dcc8', X + 37, Y + 34, 6, 5); rect('#3a2318', X + 38, Y + 36, 1, 1); rect('#3a2318', X + 41, Y + 36, 1, 1); rect('#3d7a4a', X + 35, Y + 39, 10, 7);
    rect('#b97c42', X + 4, Y + 46, w - 8, h - 46); rect('#d6a064', X + 2, Y + 44, w - 4, 3); rect('#8f5c2d', X + 8, Y + 50, w - 16, 1); rect('#8f5c2d', X + 8, Y + 56, w - 16, 1);
    rect('#f08a24', X + 10, Y + 41, 5, 3); rect('#e04a3c', X + 58, Y + 41, 5, 3); rect('#6fd06a', X + 66, Y + 41, 5, 3);
    if (night) rect('rgba(255,220,120,.22)', X + 8, Y + 30, w - 16, 16);
  }
  function drawBoxBld(X, Y, w, h) {
    rect('rgba(0,0,0,.2)', X + 2, Y + h - 2, w - 2, 3);
    rect('#f08a24', X + 8, Y + 6, 6, 6); rect('#e04a3c', X + 20, Y + 5, 6, 7); rect('#6fd06a', X + 32, Y + 6, 6, 6);
    rect('#7a4a24', X + 2, Y + 12, w - 4, h - 12); rect('#b97c42', X + 4, Y + 14, w - 8, h - 16);
    rect('#8f5c2d', X + 4, Y + 20, w - 8, 1); rect('#8f5c2d', X + 4, Y + 26, w - 8, 1);
    rect('#4a3320', X + 6, Y + 12, 2, h - 12); rect('#4a3320', X + w - 8, Y + 12, 2, h - 12);
    rect('#d6a064', X, Y + 4, w, 4); rect('#7a4a24', X, Y + 4, w, 1);
    rect('#6fd06a', X + 22, Y + 17, 4, 2); rect('#6fd06a', X + 20, Y + 19, 8, 2); rect('#6fd06a', X + 22, Y + 21, 4, 5);
  }
  function drawCaveBld(X, Y, w, h) {
    rect('#6a6d79', X, Y, w, h); rect('#8f929d', X + 2, Y + 2, 8, 2); rect('#575a66', X + 36, Y + 4, 10, 3);
    rect('#12121a', X + 10, Y + 8, 28, 24); rect('#12121a', X + 12, Y + 6, 24, 2); rect('#12121a', X + 14, Y + 4, 20, 2);
    rect('#7a4a24', X + 8, Y + 6, 3, 26); rect('#7a4a24', X + 37, Y + 6, 3, 26); rect('#8a5a2e', X + 6, Y + 3, 36, 4);
    rect('#ffd25e', X + 22, Y + 8, 3, 4); rect('rgba(255,210,94,.18)', X + 16, Y + 8, 16, 14);
    rect('#3a3a46', X + 14, Y + 30, 20, 1); rect('#4a4d58', X, Y + h - 2, w, 2);
    ctx.font = 'bold 6px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#ffd25e'; ctx.fillText('MINE', X + 24, Y + 2 + 0);
  }

  // ---------- 작물 ----------
  const LEAF = {
    carrot: ['#4aa84a', '#7bd66f', '#f08a24'], potato: ['#3f9a45', '#6fc96a', '#c9a06a'], cabbage: ['#5cae4a', '#8fd16a', '#c5ec9a'],
    tomato: ['#3f9a45', '#6fc96a', '#e04a3c'], corn: ['#4aa84a', '#7bd66f', '#ffd25e'], pumpkin: ['#3f8a3a', '#69b45e', '#f08a24']
  };
  function drawCrop(type, stage, X, Y, t) {
    const [lf, hi, fr] = LEAF[type];
    if (stage === 0) { rect(lf, X + 7, Y + 9, 2, 4); rect(hi, X + 5, Y + 8, 2, 2); rect(hi, X + 9, Y + 8, 2, 2); }
    else if (stage === 1) { rect(lf, X + 7, Y + 5, 2, 8); rect(hi, X + 4, Y + 6, 3, 2); rect(hi, X + 9, Y + 4, 3, 2); rect(hi, X + 4, Y + 9, 3, 2); rect(hi, X + 9, Y + 9, 3, 2); }
    else if (stage === 2) { rect(lf, X + 4, Y + 3, 8, 7); rect(lf, X + 3, Y + 5, 10, 4); rect(hi, X + 5, Y + 4, 2, 2); rect(hi, X + 9, Y + 6, 2, 2); rect(fr, X + 7, Y + 10, 2, 2); }
    else if (type === 'carrot') {
      rect(lf, X + 5, Y + 2, 2, 5); rect(lf, X + 7, Y + 1, 2, 6); rect(lf, X + 9, Y + 2, 2, 5);
      rect(fr, X + 4, Y + 7, 8, 2); rect(fr, X + 5, Y + 9, 6, 2); rect(fr, X + 6, Y + 11, 4, 2); rect(fr, X + 7, Y + 13, 2, 1); rect('#ffb35a', X + 5, Y + 7, 2, 1);
    } else if (type === 'potato') {
      rect(lf, X + 4, Y + 2, 8, 6); rect(lf, X + 3, Y + 4, 10, 4); rect(hi, X + 5, Y + 3, 2, 2);
      rect(fr, X + 2, Y + 9, 6, 5); rect(fr, X + 8, Y + 10, 6, 4); rect('#a8804a', X + 4, Y + 11, 1, 1); rect('#a8804a', X + 10, Y + 12, 1, 1); rect('#e2c08a', X + 3, Y + 9, 2, 1);
    } else if (type === 'cabbage') {
      rect(lf, X + 2, Y + 6, 12, 8); rect('#8fd16a', X + 3, Y + 5, 10, 8); rect(fr, X + 5, Y + 6, 3, 2); rect('#6fbf58', X + 8, Y + 7, 1, 6); rect('#6fbf58', X + 4, Y + 11, 8, 1);
    } else if (type === 'tomato') {
      rect(lf, X + 3, Y + 1, 10, 10); rect(hi, X + 4, Y + 2, 3, 2);
      rect(fr, X + 4, Y + 5, 3, 3); rect(fr, X + 9, Y + 4, 3, 3); rect(fr, X + 6, Y + 9, 3, 3);
      rect('#ffffff', X + 4, Y + 5, 1, 1); rect('#ffffff', X + 9, Y + 4, 1, 1); rect('#ffffff', X + 6, Y + 9, 1, 1); rect('#2f7a3a', X + 7, Y + 12, 2, 2);
    } else if (type === 'corn') {
      rect(lf, X + 7, Y + 1, 2, 13); rect(hi, X + 3, Y + 5, 4, 1); rect(hi, X + 9, Y + 8, 4, 1); rect(hi, X + 4, Y + 11, 3, 1);
      rect('#7bd66f', X + 9, Y + 3, 3, 6); rect(fr, X + 10, Y + 4, 1, 4); rect('#7bd66f', X + 4, Y + 6, 3, 5); rect(fr, X + 5, Y + 7, 1, 3);
    } else {
      rect(lf, X + 1, Y + 7, 4, 3); rect(lf, X + 11, Y + 7, 4, 3);
      rect('#c96a14', X + 3, Y + 5, 10, 10); rect(fr, X + 4, Y + 4, 8, 10);
      rect('#c96a14', X + 6, Y + 5, 1, 9); rect('#c96a14', X + 9, Y + 5, 1, 9); rect('#ffb35a', X + 5, Y + 6, 1, 3); rect('#3f7a30', X + 7, Y + 2, 2, 3);
    }
    if (stage === 3 && t % 2) rect('#ffffff', X + 13, Y + 2, 1, 1);
  }

  // ---------- 광산 타일 ----------
  const ORE_COL = { [COPPER]: ['#e08a3c', '#f5b87a'], [IRON]: ['#d4dbe6', '#8fa1b8'], [GOLD]: ['#ffd25e', '#fff1a8'], [CRYSTAL]: ['#7fe0ff', '#d4f6ff'] };
  function drawMineTile(x, y, t, now) {
    const X = x * T, Y = y * T, h = hsh(x, y, 11);
    if (t === WALLM) { rect('#202029', X, Y, T, T); rect('#2c2c38', X + (h % 9), Y + 2, 5, 3); rect('#16161d', X + ((h >> 3) % 9), Y + 10, 6, 3); return; }
    rect((x + y) % 2 ? '#3b3b47' : '#383843', X, Y, T, T);
    if (h % 5 === 0) rect('#4a4a58', X + (h >> 3) % 12, Y + (h >> 6) % 12, 2, 1);
    if (t === FLOOR) return;
    if (t === LUP) {
      rect('#8a5a2e', X + 4, Y, 2, T); rect('#8a5a2e', X + 10, Y, 2, T);
      for (let i = 0; i < 4; i++) rect('#c08a50', X + 4, Y + 2 + i * 4, 8, 1);
      rect('#ffe9a0', X + 7, Y + 1, 2, 2); return;
    }
    if (t === LDOWN) {
      rect('#6a6d79', X, Y, T, T); rect('#0c0c12', X + 2, Y + 2, 12, 12);
      rect('#8a5a2e', X + 4, Y + 2, 2, 8); rect('#8a5a2e', X + 10, Y + 2, 2, 8);
      for (let i = 0; i < 2; i++) rect('#c08a50', X + 4, Y + 3 + i * 4, 8, 1);
      rect('#ffe9a0', X + 7, Y + 12, 2, 2); return;
    }
    rect('#555867', X + 1, Y + 3, 14, 12); rect('#7a7d8c', X + 2, Y + 2, 12, 10); rect('#999cac', X + 3, Y + 3, 5, 3); rect('#44465a', X + 2, Y + 11, 12, 2);
    const oc = ORE_COL[t];
    if (oc) {
      rect(oc[0], X + 4, Y + 6, 2, 2); rect(oc[0], X + 9, Y + 4, 2, 2); rect(oc[1], X + 7, Y + 8, 2, 2); rect(oc[0], X + 11, Y + 8, 2, 2);
      if (t === CRYSTAL && ((now / 300) | 0) % 2) rect('#ffffff', X + 8, Y + 3, 1, 1);
      if (mineHp[x + ',' + y] === 1) rect('#2a2a35', X + 7, Y + 4, 1, 8);
    }
  }

  // ================= 그리기: 장면 =================
  function draw(now) {
    const t = Math.floor(now / 400), vw = cv.width, vh = cv.height;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, vw, vh);
    const cc = (v, m, vv) => m <= vv ? Math.round((m - vv) / 2) : Math.max(0, Math.min(m - vv, v));
    const camX = cc(Math.round(rx * T + T / 2 - vw / 2), W * T, vw), camY = cc(Math.round(ry * T + T / 2 - vh / 2), H * T, vh);
    ctx.save(); ctx.translate(-camX, -camY);
    const x0 = Math.max(0, Math.floor(camX / T)), x1 = Math.min(W - 1, Math.floor((camX + vw) / T));
    const y0 = Math.max(0, Math.floor(camY / T)), y1 = Math.min(H - 1, Math.floor((camY + vh) / T));
    const night = s.time > 1020;

    if (scene === 'mine') {
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) drawMineTile(x, y, map[y][x], now);
    } else {
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const tl = map[y][x];
        if (tl === POND) drawWater(x, y, t, false);
        else if (tl === SEA) drawWater(x, y, t, true);
        else if (tl === SOIL) drawSoil(x, y);
        else if (tl === SAND) drawSand(x, y);
        else if (tl === MOUNTAIN || tl === CAVE) drawMountain(x, y);
        else { drawGrass(x, y); if (tl === TREE) drawTree(x, y); }
      }
      for (const b of BUILDINGS) {
        const X = b.x * T, Y = b.y * T, w = b.w * T, h = b.h * T;
        if (X > camX + vw || X + w < camX || Y > camY + vh || Y + h < camY) continue;
        if (b.t === HOUSE) drawHouse(X, Y, w, h, night); else if (b.t === SHOP) drawShopBld(X, Y, w, h, night);
        else if (b.t === BOX) drawBoxBld(X, Y, w, h); else drawCaveBld(X, Y, w, h);
      }
      for (const k in plants) {
        const [x, y] = k.split(',').map(Number);
        if (x >= x0 && x <= x1 && y >= y0 && y <= y1) drawCrop(plants[k].type, stageOf(plants[k]), x * T, y * T, t);
      }
    }

    const moving = Math.abs(s.px - rx) + Math.abs(s.py - ry) > 0.05;
    const fi = moving ? Math.floor(now / 120) % 4 : 0, bob = moving && fi % 2 ? 1 : 0;
    const PX = Math.round(rx * T), PY = Math.round(ry * T);
    const dir = faceName(anim ? anim.face : fishing ? fishing.face : s.face);
    const dy = anim ? bodyDy(anim, Math.min(1, (now - anim.t0) / anim.dur)) : 0;
    rect('rgba(0,0,0,.22)', PX + 4, PY + 14, 8, 2);
    if (anim && dir === 'up') drawTool(now, PX, PY, dy);
    if (fishing && dir === 'up') drawFishing(now, PX, PY);
    ctx.drawImage(SPR[dir][fi], PX, PY - bob + dy);
    if (anim && dir !== 'up') drawTool(now, PX, PY, dy);
    if (fishing && dir !== 'up') drawFishing(now, PX, PY);
    drawParts();
    ctx.restore();

    if (scene === 'farm') {
      for (const a of amb) rect(a.c, Math.round(a.x), Math.round(a.y), a.sz, a.sz === 2 ? 1 : 1);
      if (s.time > 1080) { ctx.fillStyle = `rgba(10,15,60,${Math.min(0.5, (s.time - 1080) / 360 * 0.5)})`; ctx.fillRect(0, 0, vw, vh); }
    } else {
      const sx = rx * T + 8 - camX, sy = ry * T + 8 - camY, r = 88 + Math.sin(now / 200) * 2;
      const g = ctx.createRadialGradient(sx, sy, 14, sx, sy, r);
      g.addColorStop(0, 'rgba(8,8,20,0)'); g.addColorStop(1, 'rgba(8,8,20,.9)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);
    }
    drawFishUI();
    if (fade) { const u = (now - fade.t0) / fade.dur, a = u < 0.5 ? u * 2 : (1 - u) * 2; ctx.fillStyle = `rgba(0,0,0,${Math.max(0, Math.min(1, a))})`; ctx.fillRect(0, 0, vw, vh); }
  }

  // ================= 루프 / 화면 크기 =================
  function resize() {
    const S = Math.max(2, Math.round(Math.min(innerWidth, innerHeight) / 190));
    cv.width = Math.ceil(innerWidth / S); cv.height = Math.ceil(innerHeight / S);
    cv.style.width = cv.width * S + 'px'; cv.style.height = cv.height * S + 'px';
    cv.style.left = Math.round((innerWidth - cv.width * S) / 2) + 'px'; cv.style.top = Math.round((innerHeight - cv.height * S) / 2) + 'px';
    ctx.imageSmoothingEnabled = false;
  }
  addEventListener('resize', resize); resize();

  let prev = 0;
  function loop(now) {
    NOW = now; const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
    if (!shopOpen && !bagOpen) { s.time += dt * (DAY_END - DAY_START) / SEC_PER_DAY; if (s.time >= DAY_END) sleep(true); }
    updateFade(now); updateAnim(now); updateFishing(now, dt); tryMove(now); updateParts(dt); updateAmb(dt);
    if (scene === 'farm' && Math.random() < dt * 2.2) { const hb = BUILDINGS[0]; spawn(hb.x * T + 70 + rnd(-1, 1), hb.y * T - 2, rnd(-3, 3), rnd(-14, -8), 1.6, '#d9d9d9', 2, 0); }
    const k = Math.min(1, dt * (s.up.boots ? 24 : 16));
    rx += (s.px - rx) * k; ry += (s.py - ry) * k;
    if (Math.abs(s.px - rx) < 0.02) rx = s.px; if (Math.abs(s.py - ry) < 0.02) ry = s.py;
    draw(now); hud();
    requestAnimationFrame(loop);
  }
  say(`${SN[SEASON][1]} 지금은 ${SN[SEASON][0]}이에요! 호미(1)로 주변 땅을 갈아 보세요`, 3200);
  requestAnimationFrame(loop);
})();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>작은 농장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:#3d2b1b; --edge:#5a4128; --text:#f3e7c4; --gold:#ffd25e; --leaf:#7bc46b;
    --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
    --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:'Jua',system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{position:fixed;top:0;left:0;image-rendering:pixelated;image-rendering:crisp-edges}
  .chip{background:rgba(43,29,20,.82);border:2px solid var(--edge);border-radius:10px;padding:2px 9px;font-size:14px;line-height:1.4}
  .chip b{color:var(--gold);font-weight:normal}
  #hud{position:fixed;left:calc(8px + var(--sl));top:calc(8px + var(--st));display:flex;flex-direction:column;gap:4px;align-items:flex-start;pointer-events:none}
  #topr{position:fixed;right:calc(8px + var(--sr));top:calc(8px + var(--st));display:flex;gap:6px}
  #topr button{font:inherit;font-size:18px;color:var(--text);background:rgba(43,29,20,.82);border:2px solid var(--edge);border-radius:10px;width:40px;height:36px;cursor:pointer}
  #toast{position:fixed;left:50%;top:calc(10px + var(--st));transform:translateX(-50%);background:rgba(43,29,20,.92);border:2px solid var(--edge);
    border-radius:8px;padding:5px 14px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
  #toast.on{opacity:1}
  #hotbar{position:fixed;left:50%;bottom:calc(8px + var(--sb));transform:translateX(-50%);display:flex;gap:5px;padding:5px;
    background:rgba(43,29,20,.78);border:2px solid var(--edge);border-radius:12px}
  .slot{position:relative;width:46px;height:46px;border:3px solid var(--edge);border-radius:9px;background:#3d2b1b;padding:0;cursor:pointer}
  .slot.sel{border-color:var(--gold);background:#5a3b1f}
  .slot img{width:30px;height:30px;image-rendering:pixelated;display:block;margin:auto}
  .slot i{position:absolute;left:3px;top:0;font:11px 'Jua',sans-serif;font-style:normal;color:#f3e7c4}
  .slot .ic{position:absolute;right:1px;top:-3px;font-size:14px}
  .slot em{position:absolute;right:3px;bottom:0;font:11px 'Jua',sans-serif;font-style:normal;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}

  #stick{position:fixed;left:calc(22px + var(--sl));bottom:calc(18px + var(--sb));width:104px;height:104px;border-radius:50%;
    background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.38);touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:rgba(255,255,255,.55);box-shadow:0 2px 6px rgba(0,0,0,.35);pointer-events:none}
  #act{position:fixed;right:calc(26px + var(--sr));bottom:calc(24px + var(--sb));width:78px;height:78px;border-radius:50%;font:inherit;font-size:19px;color:#fff;
    background:rgba(255,210,94,.3);border:3px solid rgba(255,255,255,.55);touch-action:none}
  #act:active{background:rgba(255,210,94,.6)}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:10px;z-index:10}
  .modal[hidden]{display:none}
  .card{width:min(100%,780px);max-height:94vh;overflow:auto;background:var(--panel);border:3px solid var(--edge);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y}
  .shead{display:flex;align-items:center;gap:10px;font-size:20px}
  .shead .gold{margin-left:auto;color:var(--gold);font-size:16px}
  .x{font:inherit;font-size:15px;color:var(--text);background:#2f2013;border:2px solid var(--edge);border-radius:8px;padding:4px 12px;cursor:pointer}
  .stabs{display:flex;gap:8px}
  .stabs button{flex:1;font:inherit;font-size:16px;color:var(--text);background:#2f2013;border:2px solid var(--edge);border-radius:8px;padding:5px;cursor:pointer}
  .stabs button.on{border-color:var(--gold);background:#54391f}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
  .row{display:flex;align-items:center;gap:10px;background:#2f2013;border:2px solid var(--edge);border-radius:10px;padding:6px 8px}
  .ico{font-size:26px;width:34px;text-align:center}
  .info{flex:1;min-width:0;line-height:1.25;font-size:15px}
  .info small{display:block;opacity:.75;font-size:12px}
  .btns{display:flex;flex-direction:column;gap:5px}
  .btns button{font:inherit;font-size:13px;color:#2b1d14;background:var(--gold);border:0;border-radius:8px;padding:4px 9px;cursor:pointer;white-space:nowrap}
  .btns button:disabled{opacity:.35;cursor:default}
  #smsg,#bsum{min-height:1.2em;text-align:center;font-size:14px;color:var(--leaf)}

  [hidden]{display:none!important}
  .row.gray{opacity:.45;filter:grayscale(1)}
  .slot .ic.gray{filter:grayscale(1);opacity:.55}
  .stabs.wrap{flex-wrap:wrap}
  .stabs.wrap button{flex:1 1 30%}
  #dText{font-size:16px;line-height:1.5;min-height:3.4em;padding:4px 2px}
  #dPerk{font-size:12px;opacity:.8}
  .shead img{width:40px;height:40px;image-rendering:pixelated;background:#2f2013;border:2px solid var(--edge);border-radius:8px}
  .hearts{margin-left:auto;color:#ff7a9a;font-size:15px}
  #spmsg,#bamsg{min-height:1.2em;text-align:center;font-size:14px;color:var(--leaf)}
  #rotate{position:fixed;inset:0;background:#2b1d14;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20;font-size:22px;text-align:center}
  #rotate span{font-size:60px}
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:6px}
  .pick{background:#2f2013;border:3px solid var(--edge);border-radius:12px;padding:8px 22px;color:var(--text);font:inherit;font-size:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
  .pick:hover,.pick:focus-visible{border-color:var(--gold)}
  .pick.cur{border-color:var(--leaf)}
  canvas.pv{position:static;width:96px;height:120px;image-rendering:pixelated}
  #csnote{text-align:center;font-size:13px;opacity:.75}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="chip">🗓 <b id="hDay">1</b>일차 · <span id="hSeason"></span> · 🕒 <b id="hTime">06:00</b></div>
  <div class="chip">🪙 <b id="hGold">0</b> · 🎒 <b id="hBag">0</b></div>
</div>
<div id="topr"><button id="bBag" aria-label="가방">🎒</button><button id="bFs" aria-label="전체화면">⛶</button></div>
<div id="toast"></div>
<div id="hotbar"></div>
<div id="stick" aria-label="이동 조이스틱"><div id="knob"></div></div>
<button id="act" aria-label="행동">행동</button>

<div id="shop" class="modal" hidden>
  <div class="card" role="dialog" aria-label="상점">
    <div class="shead"><span>🏪 상점</span><span class="gold">🪙 <b id="sGold">0</b></span><button class="x" id="sClose">닫기</button></div>
    <div class="stabs"><button data-t="seed" class="on">씨앗</button><button data-t="tool">도구</button><button data-t="animal">동물</button></div>
    <div id="slist" class="grid"></div>
    <div id="smsg"></div>
  </div>
</div>

<div id="bag" class="modal" hidden>
  <div class="card" role="dialog" aria-label="가방">
    <div class="shead"><span>🎒 가방</span><span class="gold">🪙 <b id="bGold">0</b></span><button class="x" id="bChar">캐릭터</button><button class="x" id="bClose">닫기</button></div>
    <div id="blist" class="grid"></div>
    <div id="bsum"></div>
  </div>
</div>

<div id="seedpick" class="modal" hidden>
  <div class="card" role="dialog" aria-label="씨앗 고르기">
    <div class="shead"><span>🌱 씨앗 고르기</span><button class="x" id="spClose" style="margin-left:auto">닫기</button></div>
    <div id="splist" class="grid"></div>
    <div id="spmsg"></div>
  </div>
</div>

<div id="barn" class="modal" hidden>
  <div class="card" role="dialog" aria-label="축사">
    <div class="shead"><span>🐄 축사</span><button class="x" id="baClose" style="margin-left:auto">닫기</button></div>
    <div id="balist" class="grid"></div>
    <div id="bamsg"></div>
  </div>
</div>

<div id="dlg" class="modal" hidden>
  <div class="card" role="dialog" aria-label="대화">
    <div class="shead"><img id="dImg" alt=""><span id="dName"></span><span class="hearts" id="dHeart"></span><button class="x" id="dClose">닫기</button></div>
    <div id="dPerk"></div>
    <div id="dText"></div>
    <div id="dBtns" class="stabs wrap"></div>
    <div id="dGift" class="grid" hidden></div>
  </div>
</div>

<div id="charsel" class="modal" hidden>
  <div class="card" role="dialog" aria-label="캐릭터 선택">
    <div class="shead"><span>🧑‍🌾 캐릭터를 골라요</span></div>
    <div class="cards">
      <button class="pick" data-g="female"><canvas class="pv" width="16" height="20"></canvas>여자</button>
      <button class="pick" data-g="male"><canvas class="pv" width="16" height="20"></canvas>남자</button>
    </div>
    <div id="csnote">나중에 🎒 가방의 '캐릭터' 버튼에서 바꿀 수 있어요</div>
  </div>
</div>

<div id="rotate"><span>📱↔️</span>가로로 돌려서 플레이해 주세요</div>

<script>
(() => {
  'use strict';

  let W = FW, H = FH;
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');

  // ================= 데이터 =================

  const DAY_START = 360, DAY_END = 1440, SEC_PER_DAY = 150;

    strawberry:  { name: '딸기',     icon: '🍓', seed: 30, sell: 85,  days: 4, seasons: ['spring', 'winter'], shape: 'berry',   col: ['#3f9a45', '#6fc96a', '#e0344a'] },
    blueberry:   { name: '블루베리', icon: '🫐', seed: 40, sell: 115, days: 5, seasons: ['summer'],           shape: 'berry',   col: ['#3f8a45', '#6fb96a', '#4a5fd0'] },

  // ================= 게임 로직 =================

  function sleep(passedOut) {

  function harvestOne(key, tx, ty) {

  }
  function sellAll() {

    if (tile === LDOWN) return transition(() => switchScene('mine', floorNo + 1));

  function openShop() { shopOpen = true; shopTab = 'seed'; shopEl.hidden = false; msgEl.textContent = ''; stickDir = null; held.clear(); renderShop(); }

          `${c.seasons.map(x => SN[x][1] + SN[x][0]).join(' ')} · ${c.days}일 · 판매 ${c.sell}골드 · 보유 ${s.seeds[k]}개`,
          ok ? [[`1개 ${pr}🪙`, pr, () => buySeed(k, 1)], [`5개 ${pr * 5}🪙`, pr * 5, () => buySeed(k, 5)]] : [['다음 계절에', 0, null, true]], ok ? '' : 'gray');
      });

        row(listEl, A.icon, `${A.name} (${G.icon} ${G.name})`, `${A.days === 1 ? '매일' : A.days + '일마다'} ${G.name} · 판매 ${G.price}골드 · 현재 ${s.animals.length}/${MAX_ANIMALS}마리`, [[`${pr}🪙`, pr, () => buyAnimal(k)]]);
      });

    }
  }
  function buySeed(k, n) {
    const cost = P(CROPS[k].seed) * n;
    if (s.gold < cost) return (msgEl.textContent = '골드가 부족해요');
    s.gold -= cost; s.seeds[k] += n; ensureSeed();

  }
  function buyUp(u) {

    s.gold -= cost; s.up[u.id] = true; msgEl.textContent = `${u.name}을(를) 샀어요!`; save(); renderShop();
  }
  function buyAnimal(k) {

    rect('#f5f1e8', X + 4, Y + 24, w - 8, 2); rect('#f5f1e8', X + 4, Y + h - 3, w - 8, 3); rect('#f5f1e8', X + 4, Y + 24, 2, h - 24); rect('#f5f1e8', X + w - 6, Y + 24, 2, h - 24);
    const dx = X + (w >> 1) - 13;
    rect('#f5f1e8', dx - 2, Y + h - 34, 30, 34); rect('#8f2328', dx, Y + h - 32, 26, 32); rect('#a63a33', dx + 1, Y + h - 31, 11, 31); rect('#a63a33', dx + 14, Y + h - 31, 11, 31);
    for (let i = 0; i < 11; i++) {
      const yy = Y + h - 31 + Math.round(i * 30 / 10);
      rect('#f5f1e8', dx + 1 + i, yy, 1, 1); rect('#f5f1e8', dx + 11 - i, yy, 1, 1); rect('#f5f1e8', dx + 14 + i, yy, 1, 1); rect('#f5f1e8', dx + 24 - i, yy, 1, 1);
    }
    for (let r = 0; r < 24; r++) {
      const inset = Math.max(0, 22 - r), c = (r >> 2) % 2 ? '#6a6d79' : '#5d606c';
      rect(c, X + inset, Y + 4 + r, w - 2 * inset, 1); rect('#8f929d', X + inset, Y + 4 + r, 2, 1); rect('#44465a', X + w - inset - 2, Y + 4 + r, 2, 1);
      if (SEASON === 'winter' && r < 8) rect('#f4f8fb', X + inset + 2, Y + 4 + r, w - 2 * inset - 4, 1);
    }
    rect('#4a4d58', X, Y + 27, w, 2);
    rect('#f5f1e8', X + 33, Y + 10, 14, 11); rect('#3a2616', X + 34, Y + 11, 12, 9); rect('#e6c35a', X + 35, Y + 15, 10, 5); rect('#c9a030', X + 37, Y + 16, 2, 1); rect('#c9a030', X + 41, Y + 17, 2, 1);
    rect('#4a4d58', X + 39, Y, 2, 5); rect('#4a4d58', X + 36, Y + 1, 8, 1);
    if (night) rect('rgba(255,220,120,.2)', X + 34, Y + 11, 12, 9);
  }

  const HL = 'rgba(255,255,255,.4)';
  function drawRipe(shape, lf, hi, fr, X, Y) {
    if (shape === 'root') {
      rect(lf, X + 5, Y + 2, 2, 5); rect(lf, X + 7, Y + 1, 2, 6); rect(lf, X + 9, Y + 2, 2, 5);
      rect(fr, X + 4, Y + 7, 8, 2); rect(fr, X + 5, Y + 9, 6, 2); rect(fr, X + 6, Y + 11, 4, 2); rect(fr, X + 7, Y + 13, 2, 1); rect(HL, X + 5, Y + 7, 2, 1);
    } else if (shape === 'bulb') {
      rect(lf, X + 6, Y + 2, 1, 6); rect(lf, X + 8, Y + 1, 1, 7); rect(lf, X + 10, Y + 3, 1, 5);
      rect(fr, X + 5, Y + 7, 6, 1); rect(fr, X + 4, Y + 8, 8, 5); rect(fr, X + 5, Y + 13, 6, 1); rect(HL, X + 5, Y + 8, 2, 2); rect('#e8e0c8', X + 7, Y + 14, 2, 1);
    } else if (shape === 'tuber') {
      rect(lf, X + 4, Y + 2, 8, 6); rect(lf, X + 3, Y + 4, 10, 4); rect(hi, X + 5, Y + 3, 2, 2);
      rect(fr, X + 2, Y + 9, 6, 5); rect(fr, X + 8, Y + 10, 6, 4); rect('#a8804a', X + 4, Y + 11, 1, 1); rect('#a8804a', X + 10, Y + 12, 1, 1); rect('#e2c08a', X + 3, Y + 9, 2, 1);
    } else if (shape === 'berry') {
      rect(lf, X + 4, Y + 5, 8, 2); rect(lf, X + 3, Y + 6, 10, 7); rect(hi, X + 4, Y + 6, 3, 2);
      [[4, 9], [8, 8], [10, 10], [6, 11], [11, 7]].forEach(([a, b]) => { rect(fr, X + a, Y + b, 2, 2); rect(HL, X + a, Y + b, 1, 1); });
    } else if (shape === 'bush') {
      rect(lf, X + 3, Y + 1, 10, 10); rect(hi, X + 4, Y + 2, 3, 2);
      rect(fr, X + 4, Y + 5, 3, 3); rect(fr, X + 9, Y + 4, 3, 3); rect(fr, X + 6, Y + 9, 3, 3);
      rect('#ffffff', X + 4, Y + 5, 1, 1); rect('#ffffff', X + 9, Y + 4, 1, 1); rect('#ffffff', X + 6, Y + 9, 1, 1); rect('#2f7a3a', X + 7, Y + 12, 2, 2);
    } else if (shape === 'long') {
      rect(lf, X + 3, Y + 2, 10, 8); rect(hi, X + 4, Y + 3, 3, 2);
      rect(fr, X + 4, Y + 9, 2, 5); rect(fr, X + 8, Y + 9, 2, 6); rect(fr, X + 11, Y + 8, 2, 5);
      rect('#2f7a3a', X + 4, Y + 8, 2, 1); rect('#2f7a3a', X + 8, Y + 8, 2, 1); rect('#2f7a3a', X + 11, Y + 7, 2, 1); rect(HL, X + 4, Y + 10, 1, 2);
    } else if (shape === 'tree') {
      rect('#6b4a2b', X + 7, Y + 8, 2, 7); rect(lf, X + 3, Y + 1, 10, 1); rect(lf, X + 2, Y + 2, 12, 8); rect(hi, X + 4, Y + 3, 3, 2);
      [[4, 5], [9, 4], [7, 7], [11, 7]].forEach(([a, b]) => { rect(fr, X + a, Y + b, 2, 2); rect(HL, X + a, Y + b, 1, 1); });
    } else if (shape === 'banana') {
      rect('#7bb060', X + 7, Y + 3, 2, 11); rect(lf, X + 2, Y + 2, 5, 2); rect(lf, X + 9, Y + 2, 5, 2); rect(hi, X + 1, Y + 4, 4, 1); rect(hi, X + 11, Y + 4, 4, 1);
      rect('#6a4a2a', X + 9, Y + 6, 2, 1); rect(fr, X + 9, Y + 7, 3, 6); rect(fr, X + 11, Y + 8, 2, 5); rect('#c9a030', X + 9, Y + 12, 4, 1);
    } else if (shape === 'cactus') {
      rect(lf, X + 6, Y + 2, 4, 12); rect(lf, X + 3, Y + 6, 3, 2); rect(lf, X + 3, Y + 4, 2, 3); rect(lf, X + 10, Y + 7, 3, 2); rect(lf, X + 11, Y + 5, 2, 3);
      rect(hi, X + 7, Y + 4, 1, 8); rect(fr, X + 4, Y + 2, 3, 3); rect(fr, X + 11, Y + 3, 3, 3); rect('#ffffff', X + 5, Y + 3, 1, 1); rect('#ffffff', X + 12, Y + 4, 1, 1);
    } else if (shape === 'bamboo') {
      rect(lf, X + 4, Y, 3, 15); rect(lf, X + 9, Y + 1, 3, 14); rect(hi, X + 4, Y, 1, 15); rect(hi, X + 9, Y + 1, 1, 14);
      [3, 7, 11].forEach(b => { rect(fr, X + 4, Y + b, 3, 1); rect(fr, X + 9, Y + b + 1, 3, 1); }); rect(hi, X + 7, Y + 3, 3, 1); rect(hi, X + 2, Y + 6, 2, 1);
    } else if (shape === 'palm') {
      rect('#8a5a2e', X + 7, Y + 5, 2, 10); rect('#6b4420', X + 7, Y + 8, 2, 1); rect('#6b4420', X + 7, Y + 11, 2, 1);
      rect(lf, X + 4, Y + 1, 8, 2); rect(lf, X + 2, Y + 3, 5, 2); rect(lf, X + 9, Y + 3, 5, 2); rect(lf, X + 1, Y + 5, 3, 1); rect(lf, X + 12, Y + 5, 3, 1);
      rect(fr, X + 6, Y + 5, 2, 2); rect(fr, X + 8, Y + 5, 2, 2); rect('#c8b89a', X + 7, Y + 6, 2, 1);
    } else if (shape === 'melon') {
      rect(hi, X + 1, Y + 8, 3, 2); rect(hi, X + 12, Y + 9, 3, 2);
      rect('#2f6a2f', X + 3, Y + 5, 10, 9); rect('#4fa04a', X + 4, Y + 6, 8, 7); rect('#2f6a2f', X + 6, Y + 5, 1, 9); rect('#2f6a2f', X + 9, Y + 5, 1, 9); rect(HL, X + 5, Y + 6, 2, 1); rect('#3f7a30', X + 7, Y + 3, 2, 2);
    } else if (shape === 'pumpkin') {
      rect(lf, X + 1, Y + 7, 4, 3); rect(lf, X + 11, Y + 7, 4, 3);
      rect('#c96a14', X + 3, Y + 5, 10, 10); rect(fr, X + 4, Y + 4, 8, 10); rect('#c96a14', X + 6, Y + 5, 1, 9); rect('#c96a14', X + 9, Y + 5, 1, 9); rect('#ffb35a', X + 5, Y + 6, 1, 3); rect('#3f7a30', X + 7, Y + 2, 2, 3);
    } else if (shape === 'stalk') {
      rect(lf, X + 7, Y + 1, 2, 13); rect(hi, X + 3, Y + 5, 4, 1); rect(hi, X + 9, Y + 8, 4, 1); rect(hi, X + 4, Y + 11, 3, 1);
      rect('#7bd66f', X + 9, Y + 3, 3, 6); rect(fr, X + 10, Y + 4, 1, 4); rect('#7bd66f', X + 4, Y + 6, 3, 5); rect(fr, X + 5, Y + 7, 1, 3);
    } else if (shape === 'head') {
      rect(lf, X + 2, Y + 6, 12, 8); rect('#8fd16a', X + 3, Y + 5, 10, 8); rect(fr, X + 5, Y + 6, 3, 2); rect('#6fbf58', X + 8, Y + 7, 1, 6); rect('#6fbf58', X + 4, Y + 11, 8, 1);
    } else { // grape
      rect(lf, X + 3, Y + 1, 10, 5); rect(hi, X + 4, Y + 2, 3, 2);
      rect(fr, X + 4, Y + 6, 3, 2); rect(fr, X + 3, Y + 8, 5, 2); rect(fr, X + 4, Y + 10, 3, 2); rect(fr, X + 5, Y + 12, 1, 1);
      rect(fr, X + 9, Y + 6, 3, 2); rect(fr, X + 8, Y + 8, 5, 2); rect(fr, X + 9, Y + 10, 3, 2); rect(HL, X + 4, Y + 8, 1, 1); rect(HL, X + 9, Y + 8, 1, 1);
    }
  }
  function drawCrop(type, stage, X, Y, t) {
    const c = CROPS[type], lf = c.col[0], hi = c.col[1], fr = c.col[2];
    if (stage === 0) { rect(lf, X + 7, Y + 9, 2, 4); rect(hi, X + 5, Y + 8, 2, 2); rect(hi, X + 9, Y + 8, 2, 2); }
    else if (stage === 1) { rect(lf, X + 7, Y + 5, 2, 8); rect(hi, X + 4, Y + 6, 3, 2); rect(hi, X + 9, Y + 4, 3, 2); rect(hi, X + 4, Y + 9, 3, 2); rect(hi, X + 9, Y + 9, 3, 2); }
    else if (stage === 2) { rect(lf, X + 4, Y + 3, 8, 7); rect(lf, X + 3, Y + 5, 10, 4); rect(hi, X + 5, Y + 4, 2, 2); rect(hi, X + 9, Y + 6, 2, 2); rect(fr, X + 7, Y + 10, 2, 2); }
    else drawRipe(c.shape, lf, hi, fr, X, Y);
    if (stage === 3 && t % 2) rect('#ffffff', X + 13, Y + 2, 1, 1);
  }

  // ---------- 광산 타일 ----------
  const ORE_COL = { [COPPER]: ['#e08a3c', '#f5b87a'], [IRON]: ['#d4dbe6', '#8fa1b8'], [GOLD]: ['#ffd25e', '#fff1a8'], [CRYSTAL]: ['#7fe0ff', '#d4f6ff'] };
  function drawMineTile(x, y, t, now) {
    const X = x * T, Y = y * T, h = hsh(x, y, 11);
    if (t === WALLM) { rect('#202029', X, Y, T, T); rect('#2c2c38', X + (h % 9), Y + 2, 5, 3); rect('#16161d', X + ((h >> 3) % 9), Y + 10, 6, 3); return; }
    rect((x + y) % 2 ? '#3b3b47' : '#383843', X, Y, T, T);
    if (h % 5 === 0) rect('#4a4a58', X + (h >> 3) % 12, Y + (h >> 6) % 12, 2, 1);
    if (t === FLOOR) return;
    if (t === LUP) {
      rect('#8a5a2e', X + 4, Y, 2, T); rect('#8a5a2e', X + 10, Y, 2, T);
      for (let i = 0; i < 4; i++) rect('#c08a50', X + 4, Y + 2 + i * 4, 8, 1);
      rect('#ffe9a0', X + 7, Y + 1, 2, 2); return;
    }
    if (t === LDOWN) {
      rect('#6a6d79', X, Y, T, T); rect('#0c0c12', X + 2, Y + 2, 12, 12);
      rect('#8a5a2e', X + 4, Y + 2, 2, 8); rect('#8a5a2e', X + 10, Y + 2, 2, 8);
      for (let i = 0; i < 2; i++) rect('#c08a50', X + 4, Y + 3 + i * 4, 8, 1);
      rect('#ffe9a0', X + 7, Y + 12, 2, 2); return;
    }
    rect('#555867', X + 1, Y + 3, 14, 12); rect('#7a7d8c', X + 2, Y + 2, 12, 10); rect('#999cac', X + 3, Y + 3, 5, 3); rect('#44465a', X + 2, Y + 11, 12, 2);
    const oc = ORE_COL[t];
    if (oc) {
      rect(oc[0], X + 4, Y + 6, 2, 2); rect(oc[0], X + 9, Y + 4, 2, 2); rect(oc[1], X + 7, Y + 8, 2, 2); rect(oc[0], X + 11, Y + 8, 2, 2);
      if (t === CRYSTAL && ((now / 300) | 0) % 2) rect('#ffffff', X + 8, Y + 3, 1, 1);
      if (mineHp[x + ',' + y] === 1) rect('#2a2a35', X + 7, Y + 4, 1, 8);
    }
  }

  // ================= 그리기: 장면 =================
  function draw(now) {
    const t = Math.floor(now / 400), vw = cv.width, vh = cv.height;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, vw, vh);
    const cc = (v, m, vv) => m <= vv ? Math.round((m - vv) / 2) : Math.max(0, Math.min(m - vv, v));
    const camX = cc(Math.round(rx * T + T / 2 - vw / 2), W * T, vw), camY = cc(Math.round(ry * T + T / 2 - vh / 2), H * T, vh);
    ctx.save(); ctx.translate(-camX, -camY);
    const x0 = Math.max(0, Math.floor(camX / T)), x1 = Math.min(W - 1, Math.floor((camX + vw) / T));
    const y0 = Math.max(0, Math.floor(camY / T)), y1 = Math.min(H - 1, Math.floor((camY + vh) / T));
    const night = s.time > 1020;

    if (scene === 'mine') {
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) drawMineTile(x, y, map[y][x], now);
    } else {
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const tl = map[y][x];
        if (tl === POND) drawWater(x, y, t, false);
        else if (tl === SEA) drawWater(x, y, t, true);
        else if (tl === SOIL) drawSoil(x, y);
        else if (tl === SAND) drawSand(x, y);
        else if (tl === MOUNTAIN || tl === CAVE) drawMountain(x, y);
        else { drawGrass(x, y); if (tl === TREE) drawTree(x, y); else if (tl === FENCE) drawFence(x, y); }
      }
      for (const b of BUILDINGS) {
        const X = b.x * T, Y = b.y * T, w = b.w * T, h = b.h * T;
        if (X > camX + vw || X + w < camX || Y > camY + vh || Y + h < camY) continue;
        if (b.t === HOUSE) drawHouse(X, Y, w, h, night); else if (b.t === SHOP) drawShopBld(X, Y, w, h, night);
        else if (b.t === BOX) drawBoxBld(X, Y, w, h); else if (b.t === BARN) drawBarnBld(X, Y, w, h, night); else drawCaveBld(X, Y, w, h);
      }
      for (const k in plants) {
        const [x, y] = k.split(',').map(Number);
        if (x >= x0 && x <= x1 && y >= y0 && y <= y1) drawCrop(plants[k].type, stageOf(plants[k]), x * T, y * T, t);
      }
    }

    const ents = scene === 'farm' ? allEnts() : [];
    ents.filter(e => e.dy <= ry).forEach(e => drawEnt(e, now));
    const moving = Math.abs(s.px - rx) + Math.abs(s.py - ry) > 0.05;
    const fi = moving ? Math.floor(now / 120) % 4 : 0, bob = moving && fi % 2 ? 1 : 0;
    const PX = Math.round(rx * T), PY = Math.round(ry * T);
    const dir = faceName(anim ? anim.face : fishing ? fishing.face : s.face);
    const dy = anim ? bodyDy(anim, Math.min(1, (now - anim.t0) / anim.dur)) : 0;
    rect('rgba(0,0,0,.22)', PX + 4, PY + 14, 8, 2);
    if (anim && dir === 'up') drawTool(now, PX, PY, dy);
    if (fishing && dir === 'up') drawFishing(now, PX, PY);
    const frm = SPR[dir][fi]; ctx.drawImage(frm, PX + 8 - (frm.width >> 1), PY + 16 - frm.height - bob + dy);
    if (anim && dir !== 'up') drawTool(now, PX, PY, dy);
    if (fishing && dir !== 'up') drawFishing(now, PX, PY);
    ents.filter(e => e.dy > ry).forEach(e => drawEnt(e, now));
    drawParts();
    ctx.restore();

    if (scene === 'farm') {
      for (const a of amb) rect(a.c, Math.round(a.x), Math.round(a.y), a.sz, a.sz === 2 ? 1 : 1);
      if (s.time > 1080) { ctx.fillStyle = `rgba(10,15,60,${Math.min(0.5, (s.time - 1080) / 360 * 0.5)})`; ctx.fillRect(0, 0, vw, vh); }
    } else {
      const sx = rx * T + 8 - camX, sy = ry * T + 8 - camY, r = 88 + Math.sin(now / 200) * 2;
      const g = ctx.createRadialGradient(sx, sy, 14, sx, sy, r);
      g.addColorStop(0, 'rgba(8,8,20,0)'); g.addColorStop(1, 'rgba(8,8,20,.9)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);
    }
    drawFishUI();
    if (fade) { const u = (now - fade.t0) / fade.dur, a = u < 0.5 ? u * 2 : (1 - u) * 2; ctx.fillStyle = `rgba(0,0,0,${Math.max(0, Math.min(1, a))})`; ctx.fillRect(0, 0, vw, vh); }
  }

  // ================= 루프 / 화면 크기 =================
  function resize() {
    const S = Math.max(2, Math.round(Math.min(innerWidth, innerHeight) / 190));
    cv.width = Math.ceil(innerWidth / S); cv.height = Math.ceil(innerHeight / S);
    cv.style.width = cv.width * S + 'px'; cv.style.height = cv.height * S + 'px';
    cv.style.left = Math.round((innerWidth - cv.width * S) / 2) + 'px'; cv.style.top = Math.round((innerHeight - cv.height * S) / 2) + 'px';
    ctx.imageSmoothingEnabled = false;
  }
  addEventListener('resize', resize); resize();

  // 저장 데이터 보정 + 시작 설정
  s.seeds = Object.assign(mk(CROP_KEYS), s.seeds); s.harvest = Object.assign(mk(CROP_KEYS), s.harvest);
  s.goods = Object.assign(mk(Object.keys(GOODS)), s.goods);
  s.animals = s.animals || []; s.friend = s.friend || {}; s.talked = s.talked || {}; s.gifted = s.gifted || {}; s.feed = s.feed || 0;
  if (!loaded) { const k0 = sortedCrops().find(canPlant); s.seeds = mk(CROP_KEYS); s.seeds[k0] = 5; s.seedSel = k0; }
  ensureSeed(); rebuildAnimals();
  buildChar(s.char || 'female');
  document.querySelectorAll('#charsel .pick').forEach(b => {
    const g = b.dataset.g;
    b.querySelector('canvas').getContext('2d').drawImage(charFrames(g).down[0], 0, 0);
    b.onclick = () => { s.char = g; buildChar(g); closeX(); say(g === 'male' ? '남자 캐릭터로 바꿨어요!' : '여자 캐릭터로 바꿨어요!'); };
  });
  $('bChar').onclick = () => { closeBag(); openX('charsel'); };
  if (!s.char) openX('charsel');

  let prev = 0;
  function loop(now) {
    NOW = now; const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
    if (!shopOpen && !bagOpen && !xOpen) { s.time += dt * (DAY_END - DAY_START) / SEC_PER_DAY; if (s.time >= DAY_END) sleep(true); }
    updateFade(now); updateAnim(now); updateFishing(now, dt); tryMove(now); updateParts(dt); updateAmb(dt); updateEntities(dt);
    if (scene === 'farm' && Math.random() < dt * 2.2) { const hb = BUILDINGS[0]; spawn(hb.x * T + 70 + rnd(-1, 1), hb.y * T - 2, rnd(-3, 3), rnd(-14, -8), 1.6, '#d9d9d9', 2, 0); }
    const k = Math.min(1, dt * (s.up.boots ? 24 : 16));
    rx += (s.px - rx) * k; ry += (s.py - ry) * k;
    if (Math.abs(s.px - rx) < 0.02) rx = s.px; if (Math.abs(s.py - ry) < 0.02) ry = s.py;
    draw(now); hud();
    requestAnimationFrame(loop);
  }
  say(`${SN[SEASON][1]} 지금은 ${SN[SEASON][0]}이에요! 호미(1)로 주변 땅을 갈아 보세요`, 3200);
  requestAnimationFrame(loop);
})();
</script>
</body>
